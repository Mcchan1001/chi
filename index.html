<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>中文堂即時互動 · 高中中國語文</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
:root{
  --pink:#F7B7CB; --blue:#A8D8F0; --mint:#A8E6CF; --lemon:#FFE9A8;
  --lilac:#CDB8E8; --peach:#FFCBA8;
  --ink:#2E3440; --mute:#6B7280;
  --glass:rgba(255,255,255,.58); --glassb:rgba(255,255,255,.80);
  --line:rgba(255,255,255,.85);
  --sh:0 8px 28px rgba(90,110,160,.16);
  --hard:0 5px 0 rgba(120,130,170,.26);
}
body{
  font-family:"PingFang HK","PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  color:var(--ink); min-height:100vh; overscroll-behavior:none;
  background:
    radial-gradient(58vw 52vw at 8% 4%,  #FBD5E4 0%, transparent 62%),
    radial-gradient(52vw 48vw at 96% 8%, #CFE8FA 0%, transparent 60%),
    radial-gradient(60vw 55vw at 88% 96%,#D8F2E4 0%, transparent 62%),
    radial-gradient(52vw 50vw at 4% 94%, #FFF0C9 0%, transparent 60%),
    linear-gradient(160deg,#EEF4FD 0%,#FCF3F7 55%,#F1FAF5 100%);
  background-attachment:fixed;
}
ruby{ruby-position:under}
ruby{margin:0 1px}
ruby rt{font-size:.40em;color:#4C7FA8;font-weight:700;line-height:1.2;padding:0 .3em;
  white-space:nowrap}
body.nojy ruby rt{display:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hide{display:none!important}
.tr{display:block;font-size:.62em;color:#6B7B8C;font-weight:600;margin-top:3px;line-height:1.4}

.glass{background:var(--glass);backdrop-filter:blur(16px) saturate(150%);
  -webkit-backdrop-filter:blur(16px) saturate(150%);
  border:1px solid var(--line);border-radius:26px;box-shadow:var(--sh)}
.btn{border-radius:20px;font-size:1.15rem;font-weight:800;padding:14px 26px;
  box-shadow:var(--hard);transition:transform .1s,box-shadow .1s;color:#2E3440;
  background:var(--glassb);border:1px solid var(--line);min-height:56px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(120,130,170,.26)}
.btn:disabled{opacity:.4;box-shadow:none;transform:none}
.btn.pink{background:linear-gradient(180deg,#FCC9DA,#F5A8C2)}
.btn.blue{background:linear-gradient(180deg,#BFE4F7,#93CDEA)}
.btn.mint{background:linear-gradient(180deg,#BFEFDA,#93DEBE)}
.btn.lemon{background:linear-gradient(180deg,#FFF0BE,#FFE192)}
.btn.lilac{background:linear-gradient(180deg,#DECCF2,#C3AAE4)}
.btn.peach{background:linear-gradient(180deg,#FFDCC2,#FFC29B)}
.btn.sm{font-size:.95rem;padding:9px 15px;min-height:0;border-radius:14px}
.btn .tr{color:#5A6B7C}

#roles{min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:24px;padding:26px;text-align:center}
#roles h1{font-size:2.6rem;letter-spacing:3px;color:#33506E;text-shadow:0 2px 0 #fff}
#roles .sub{color:var(--mute);font-size:1rem;margin-top:-8px}
.rolebtns{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.rolecard{padding:30px 38px;min-width:210px;border-radius:30px;
  background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--line);
  box-shadow:var(--hard);transition:transform .1s}
.rolecard:active{transform:translateY(4px)}
.rolecard .ico{font-size:2.9rem}
.rolecard .t{font-size:1.45rem;font-weight:900;margin-top:8px}
.rolecard .d{font-size:.85rem;color:var(--mute);margin-top:6px;line-height:1.6}

.top{background:rgba(255,255,255,.65);backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);padding:10px 18px;display:flex;
  align-items:center;gap:13px;flex-wrap:wrap;position:sticky;top:0;z-index:40}
.top .ttl{font-size:1.1rem;font-weight:900;color:#33506E}
.top .meta{font-size:.82rem;color:var(--mute)}
.top .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top select{font-family:inherit;font-size:.83rem;background:var(--glassb);
  border:1px solid var(--line);border-radius:12px;padding:6px 10px;max-width:44vw;font-weight:700}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:13px;height:13px;border-radius:50%;background:rgba(120,140,180,.24)}
.dot.on{background:#7FD3B0} .dot.done{background:#F4B740}

.steps{display:flex;gap:8px;padding:14px 18px 0;flex-wrap:wrap;max-width:1400px;margin:0 auto;
  align-items:center}
.btn.holdon{animation:pulse 1.2s ease-in-out infinite;
  box-shadow:0 0 0 4px rgba(232,155,98,.35), var(--hard);border-color:#E89B62}
.holdwait{background:var(--glassb);border:1px solid var(--line);border-radius:28px;
  box-shadow:var(--sh);margin:16px}
.sendbox{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sendchip{font-size:.9rem;font-weight:800;color:#1E8E62;background:rgba(233,250,243,.9);
  border:1px solid var(--line);border-radius:20px;padding:6px 14px;white-space:nowrap}
.sendchip.on{color:#8A5B12;background:rgba(255,246,220,.95);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.gotchip{display:flex;align-items:center;gap:8px}
.gotnum{font-size:.9rem;font-weight:900;color:var(--mute);background:var(--glassb);
  border:1px solid var(--line);border-radius:20px;padding:6px 12px;white-space:nowrap}
.gotnum.all{color:#1E8E62;background:rgba(233,250,243,.95)}
.gotdots{display:flex;gap:4px}
.gotdots i{width:11px;height:11px;border-radius:50%;background:rgba(120,140,180,.28)}
.gotdots i.y{background:#7FD3B0}
.step{padding:10px 17px;border-radius:16px;background:rgba(255,255,255,.42);
  font-weight:800;font-size:.95rem;color:var(--mute);border:1px solid rgba(255,255,255,.6)}
.step.on{background:var(--glassb);color:#2E3440;box-shadow:var(--sh)}
.panel{padding:22px;margin:12px auto 24px;max-width:1400px}

.textrow{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.textrow img{width:min(470px,100%);border-radius:22px;border:5px solid #fff;box-shadow:var(--sh)}
.sentence{flex:1;min-width:290px}
.sentence .zh{font-size:2rem;line-height:2.6;font-weight:800}
.sentence .zh w{display:inline-block;padding:2px 4px;border-radius:10px;cursor:pointer}
.sentence .zh w.key{background:rgba(255,233,168,.85);box-shadow:inset 0 -4px 0 #F4C95D}
.sentence .zh w:active{background:#BFEFDA}
.zh w.reading, .sentence .zh w.reading{background:#FFD9D9;color:#C0392B;
  box-shadow:inset 0 -5px 0 #E74C3C;border-radius:10px}
.zh w.reading ruby rt{color:#C0392B}
.note{background:rgba(255,255,255,.55);border-left:5px solid var(--lemon);
  border-radius:0 16px 16px 0;padding:13px 16px;font-size:.93rem;line-height:1.75;margin:14px 0}
.row{display:flex;gap:11px;flex-wrap:wrap;align-items:center}

.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:15px}
.vcard{background:var(--glassb);border:1px solid var(--line);border-radius:22px;padding:13px;
  text-align:center;box-shadow:var(--hard);transition:transform .1s}
.vcard:active{transform:translateY(3px)}
.vcard img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;background:#fff}
.vcard .w{font-size:1.55rem;font-weight:900;margin-top:10px}
.vcard .e{font-size:.82rem;color:var(--mute);font-weight:700}
.vcard.big{grid-column:1/-1}
.vcard.big img{max-width:380px;max-height:260px;object-fit:contain;margin:0 auto;display:block;aspect-ratio:auto}
.vcard.big .w{font-size:3.3rem}

.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:15px}
.scard{background:var(--glassb);border:1px solid var(--line);border-radius:22px;padding:15px;
  box-shadow:var(--sh)}
.scard .nm{font-size:1.08rem;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.scard .lv{font-size:.7rem;font-weight:800;padding:3px 9px;border-radius:20px;background:#EEF2F8;color:var(--mute)}
.scard .lv.g1{background:#CFEFE0;color:#26705A}
.scard .lv.g2{background:#CFE3F7;color:#28577F}
.scard .lv.g3{background:#FFE0C7;color:#96541F}
.scard .st{font-size:.9rem;color:var(--mute);margin-top:8px}
.scard.done{border-color:#8FD9BC;background:rgba(233,250,243,.82)}
.ans{background:rgba(255,255,255,.75);border-radius:14px;padding:9px 12px;margin-top:9px;font-size:1rem}
.ans .ok{color:#1E8E62;font-weight:900} .ans .no{color:#C0554A;font-weight:900}
.ans img{max-width:100%;border-radius:10px;border:1px solid var(--line);background:#fff}
.rub{display:flex;gap:5px;margin-top:9px}
.rub button{flex:1;border:1px solid var(--line);border-radius:11px;padding:8px 0;
  font-weight:900;font-size:1rem;background:rgba(255,255,255,.8)}
.rub button.on{background:linear-gradient(180deg,#BFEFDA,#7FD3B0);color:#1B5E45}
.coin{display:flex;align-items:center;gap:9px;margin-top:9px;font-size:1.02rem;font-weight:900;color:#B7791F}
.coin button{border:1px solid var(--line);border-radius:11px;width:38px;height:38px;
  font-size:1.15rem;font-weight:900;background:rgba(255,255,255,.85)}

.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:16px;padding:20px;
  max-width:1100px;margin:0 auto}
.pick button{background:var(--glassb);border-radius:26px;padding:22px 10px;
  box-shadow:var(--hard);border:1px solid var(--line);transition:transform .1s}
.pick button:active{transform:translateY(4px)}
.pick .av{width:74px;height:74px;border-radius:50%;color:#33506E;
  font-size:1.9rem;font-weight:900;display:flex;align-items:center;justify-content:center;
  margin:0 auto 10px;border:3px solid #fff;box-shadow:var(--sh)}
.pick .n{font-size:1.08rem;font-weight:900}

.stu{padding:16px;max-width:940px;margin:0 auto}
.q{background:var(--glassb);border:1px solid var(--line);border-radius:28px;padding:24px;
  box-shadow:var(--sh);margin-bottom:16px}
.q .qt{font-size:.98rem;color:var(--mute);font-weight:800;margin-bottom:10px}
.q .qq{font-size:1.6rem;font-weight:900;line-height:2.1}
.q .qq .blank{display:inline-block;min-width:116px;border-bottom:5px solid #7FB6D9;
  text-align:center;color:#2A6E9E}
.q .qq .blank.filled{border-bottom-color:#F4B740;color:#8A5B12}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:14px;margin-top:18px}
.opt{background:rgba(255,255,255,.82);border:4px solid rgba(200,215,235,.85);border-radius:20px;
  padding:16px 10px;font-size:1.6rem;font-weight:900;text-align:center;min-height:88px;
  box-shadow:var(--hard);transition:transform .1s}
.opt:active{transform:translateY(3px)}
.opt.pickd{border-color:#F4B740;background:linear-gradient(180deg,#FFF6DC,#FFEBB8)}
.opt.used{opacity:.34}
.opt img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;margin-bottom:6px}
.pad{border:5px solid #fff;border-radius:22px;background:#fff;touch-action:none;
  display:block;width:100%;max-width:820px;margin:14px auto;box-shadow:var(--sh)}
.bigword{text-align:center;font-size:4.2rem;font-weight:900;line-height:2.1;letter-spacing:6px}
.bigword ruby rt{font-size:.30em;color:#3C7AA8}
.dual{display:grid;gap:14px;margin-top:12px}
.way{border:2px solid rgba(200,215,235,.7);border-radius:20px;padding:12px;
  background:rgba(255,255,255,.5);transition:opacity .2s}
.way.off{opacity:.32;pointer-events:none;filter:grayscale(1)}
.way .waylb{font-size:1rem;font-weight:800;color:var(--mute);margin-bottom:4px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.way .lock{font-size:.8rem;font-weight:800;background:#E7ECF3;color:#6B7280;
  border-radius:20px;padding:2px 10px}
.typebox{display:block;width:100%;max-width:820px;margin:10px auto 0;font-family:inherit;
  font-size:2.4rem;font-weight:900;text-align:center;padding:14px 18px;border-radius:18px;
  border:4px solid rgba(200,215,235,.9);background:#fff;letter-spacing:6px}
.typebox:focus{outline:none;border-color:#F4B740}
.padbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.waitbox{text-align:center;padding:54px 20px;max-width:640px;margin:0 auto}
.waitbox .em{font-size:4.4rem}
.waitbox .t{font-size:1.6rem;font-weight:900;margin-top:14px}
.waitbox .d{font-size:1rem;color:var(--mute);margin-top:8px;line-height:1.8}
.hintbox{margin-top:14px;background:rgba(255,243,205,.82);border:2px dashed #F4C95D;
  border-radius:16px;padding:13px 16px;font-size:1.1rem;font-weight:700;text-align:center}
.hintbox img{max-width:210px;border-radius:12px;display:block;margin:8px auto 0}
.ticket{background:repeating-linear-gradient(135deg,#FFF6DC 0 14px,#FFEFC4 14px 28px);
  border:4px dashed #F4B740;border-radius:22px;padding:20px;text-align:center;
  margin-bottom:16px;box-shadow:var(--sh);animation:pop .5s}

.pdots{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}
.pdot{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.7);
  border:3px solid #C3CFE0;display:flex;align-items:center;justify-content:center;
  font-size:.72rem;font-weight:900;color:var(--mute)}
.pdot.cur{border-color:#5FA8D3;background:#DCEEF9;color:#28577F;transform:scale(1.22)}
.pdot.ok{background:#7FD3B0;border-color:#4FB894;color:#fff}

.opt.right{border-color:#7FD3B0!important;
  background:linear-gradient(180deg,#E4F8EE,#BFEFDA)!important;
  box-shadow:0 0 0 5px rgba(127,211,176,.35),var(--hard)}
.opt.wrong{animation:shake .5s;border-color:#E7746A!important;
  background:linear-gradient(180deg,#FDE4E1,#F8CFCA)!important}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-12px)}
  40%,80%{transform:translateX(12px)}}
.wrongmask{position:fixed;inset:0;z-index:69;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:rgba(231,116,106,.24);
  pointer-events:none;animation:shake .5s}
.wrongmask .wx{font-size:5rem}
.wrongmask .wt{font-size:1.7rem;font-weight:900;color:#B03A2E;margin-top:8px}
#cheer{display:none;position:fixed;inset:0;z-index:70;align-items:center;justify-content:center;
  flex-direction:column;text-align:center;background:rgba(127,211,176,.94);color:#fff}
#cheer.show{display:flex}
#cheer .big{font-size:5.2rem;animation:pop .5s}
#cheer h2{font-size:2.3rem;margin:12px 0 20px;animation:pop .6s}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.14)}100%{transform:scale(1)}}
.confetti{position:fixed;top:-60px;font-size:2.1rem;z-index:71;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}

.admin{max-width:1180px;margin:0 auto;padding:18px}
table.adm{width:100%;border-collapse:separate;border-spacing:0 8px}
table.adm th{font-size:.83rem;color:var(--mute);text-align:left;padding:0 10px 4px;font-weight:800}
table.adm td{background:var(--glassb);padding:11px 10px;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);font-size:.96rem}
table.adm td:first-child{border-left:1px solid var(--line);border-radius:16px 0 0 16px;font-weight:900}
table.adm td:last-child{border-right:1px solid var(--line);border-radius:0 16px 16px 0}
table.adm select{font-family:inherit;font-size:.93rem;padding:7px 9px;border-radius:11px;
  border:1px solid var(--line);background:rgba(255,255,255,.85);font-weight:700}
.nmbox{font-family:inherit;font-size:1rem;font-weight:900;padding:7px 10px;border-radius:11px;
  border:1px solid var(--line);background:rgba(255,255,255,.85);width:100%;max-width:170px}
.nmbox:focus{outline:none;border-color:#F4B740}
.sw{position:relative;display:inline-block;width:54px;height:30px}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#CFD8E3;border-radius:30px;transition:.2s}
.sw span:before{content:"";position:absolute;height:24px;width:24px;left:3px;top:3px;
  background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+span{background:#7FD3B0}
.sw input:checked+span:before{transform:translateX(24px)}

.filewarn{position:fixed;left:0;right:0;bottom:0;z-index:90;
  background:linear-gradient(180deg,#FFE2DC,#FFC9BE);border-top:3px solid #E7746A;
  color:#7A2E22;padding:14px 18px;font-size:1rem;font-weight:700;line-height:1.7;
  box-shadow:0 -6px 20px rgba(0,0,0,.12)}
.filewarn code{background:rgba(255,255,255,.8);border-radius:8px;padding:2px 8px;
  font-size:.85rem;word-break:break-all}
.filewarn button{background:#fff;border-radius:12px;padding:7px 16px;margin-left:10px;
  font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.15)}

.hello{text-align:center;padding:34px 20px 26px;background:var(--glassb);
  border:1px solid var(--line);border-radius:28px;box-shadow:var(--sh);margin-bottom:16px}
.hello .sun{font-size:5rem;line-height:1;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(4deg)}}
.hello .hi{font-size:3rem;font-weight:900;margin-top:8px;letter-spacing:3px}
.hello .hisub{font-size:1.05rem;color:var(--mute);font-weight:700;margin-top:4px}
.hello .wave{margin-top:12px;font-size:1.9rem;display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.hello .wave span{display:inline-block;animation:wv 1.4s ease-in-out infinite;transform-origin:70% 70%}
@keyframes wv{0%,100%{transform:rotate(0)}25%{transform:rotate(22deg)}75%{transform:rotate(-14deg)}}

.qrow{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.qrbox{background:#fff;border:1px solid var(--line);border-radius:24px;padding:16px;
  box-shadow:var(--sh);text-align:center;flex-shrink:0}
.qrsvg{width:clamp(180px,22vw,260px);aspect-ratio:1}
.qrsvg svg{width:100%;height:100%;display:block}
.qrcap{font-size:.95rem;font-weight:800;color:var(--mute);margin-top:8px}
.qrwarn{font-size:.85rem;font-weight:800;color:#C0554A;margin-top:6px;max-width:240px}
.qrtext{flex:1;min-width:280px}
.qrzoom{position:fixed;inset:0;z-index:80;background:rgba(255,255,255,.97);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
.qrzin{width:min(74vh,74vw)}
.qrzin svg{width:100%;height:100%;display:block}
.qrzcap{font-size:1.6rem;font-weight:900}

.goals{display:flex;flex-direction:column;gap:11px}
.goal{display:flex;align-items:center;gap:14px;text-align:left;width:100%;
  background:var(--glassb);border:2px solid var(--line);border-radius:20px;
  padding:14px 18px;box-shadow:var(--sh)}
.goal .gico{font-size:2.1rem;flex-shrink:0}
.goal .gtxt{flex:1;font-size:1.15rem;font-weight:800;line-height:1.9}
.goal .gno{width:38px;height:38px;border-radius:50%;flex-shrink:0;
  background:#EEF2F8;color:var(--mute);font-weight:900;font-size:1.05rem;
  display:flex;align-items:center;justify-content:center}
.goal.tick{cursor:pointer;transition:transform .1s}
.goal.tick:active{transform:translateY(3px)}
.goal.on{border-color:#7FD3B0;background:linear-gradient(100deg,rgba(233,250,243,.95),rgba(255,255,255,.8))}
.goal.on .gno{background:#7FD3B0;color:#fff}

.ranklist{display:flex;flex-direction:column;gap:10px}
.rank{display:grid;grid-template-columns:56px 128px 1fr 92px auto;
  grid-template-areas:"pos who bar amt ctl" ". det det det det";
  align-items:center;gap:6px 12px;background:var(--glassb);border:1px solid var(--line);
  border-radius:20px;padding:12px 16px;box-shadow:var(--sh)}
.rank .pos{grid-area:pos;font-size:1.9rem;font-weight:900;text-align:center}
.rank .who{grid-area:who;font-size:1.25rem;font-weight:900}
.rank .bar{grid-area:bar;height:16px;background:rgba(180,195,220,.3);border-radius:20px;overflow:hidden}
.rank .fill{height:100%;border-radius:20px;background:linear-gradient(90deg,#BFEFDA,#7FD3B0);
  transition:width .35s}

  .cert .c6{font-size:64pt;margin:14pt 0}
  .cert .c7{font-size:14pt;margin-top:20pt}
}

/* ===== 第二版：60／90 分鐘、課堂活動、多選、計時 ===== */
.lisclock{font-weight:900;color:#33506E;background:rgba(255,255,255,.7);border-radius:16px;padding:5px 14px;font-size:1rem}
.lislen{display:inline-flex;border-radius:18px;overflow:hidden;border:3px solid #9DBBD8;background:#fff}
.lislen button{padding:7px 16px;font-size:1rem;font-weight:900;color:#3B4F6E;background:#fff;font-family:inherit}
.lislen button.on{background:#5FA8D3;color:#fff}
.lisbadge.st-act{background:#FFD9B8;color:#8A4A17}
.lisdot.ac{border-radius:6px;transform:rotate(45deg) scale(.9)}
.lisdot.ac.cur{transform:rotate(45deg) scale(1.1)}
.lisdot.xt{border-style:dashed}
.lisbox.act{background:linear-gradient(180deg,#FFF8EC,#FFEBD2);border:3px solid #F2B880}
.lisactbar{display:inline-block;background:#E38A1F;color:#fff;font-weight:900;font-size:1.15rem;padding:5px 20px;border-radius:18px;margin-bottom:6px}
.lisactsteps{list-style:none;margin:12px auto;padding:0;max-width:860px;text-align:left}
.lisactsteps li{display:flex;gap:14px;align-items:flex-start;background:#fff;border-radius:20px;padding:10px 18px;margin-bottom:8px;border:2px solid #F2D2B0}
.lisactsteps .n{flex:none;width:40px;height:40px;border-radius:50%;background:#E38A1F;color:#fff;font-weight:900;font-size:1.3rem;display:flex;align-items:center;justify-content:center;margin-top:6px}
.lisactsteps .tx{font-size:1.5rem;font-weight:800;line-height:2.2}
.lismat{display:inline-block;margin-top:6px;padding:6px 16px;border-radius:14px;background:#EEF3FA;color:#3B4F6E;font-weight:800;font-size:1.05rem}
.listm{margin-top:12px}
.lisbigtm{font-size:5rem;font-weight:900;color:#244E70;font-variant-numeric:tabular-nums;line-height:1.3}
.lisbigtm.end{color:#C0392B;animation:lispulse .6s ease-in-out infinite}
.lispicknote{font-size:1.25rem;font-weight:900;color:#8A5B12;margin:2px 0 6px}
.lisclkbtn{font-weight:900;color:#33506E;background:none;border:0;font-family:inherit;font-size:1rem;cursor:pointer}

/* 課堂活動頁：電視上一屏盡量看得完 */
.lisbox.act .lishero{font-size:3.2rem}
.lisbox.act .listitle{font-size:2.1rem;line-height:1.9;margin-top:0}
.lisbox.act .lisline{font-size:1.35rem;line-height:2}
.lisactsteps .tx{font-size:1.35rem;line-height:2.1}
.lisactsteps li{padding:6px 16px;margin-bottom:6px}
.lisbigtm{font-size:4rem;line-height:1.2}


/* ==================================================================
   第一階段：新視覺
   設計重點：以「田字格」作為全課件的記認 —— 單元、名字、等待畫面都用同一個格子，
   其餘畫面保持安靜。動畫只在兩處：首頁第一次出現時，字逐個寫上格；
   和老師按下去之後轉頁的短淡入。「安靜模式」或系統「減少動態」會全部關掉。
   ================================================================== */
:root{
  --ink:#1F2B3A; --mute:#5C6877;
  --seal:#D9483B;
  --u1:#FBD5E4; --u1d:#B03A68;
  --u2:#CDE6F8; --u2d:#1B63A0;
  --u3:#FFE7A0; --u3d:#8F5A00;
  --u4:#D2EFE0; --u4d:#17785A;
  --uL:#E3D6F6; --uLd:#5A3CA5;
  --kai:"Kaiti TC","BiauKai","DFKai-SB","標楷體","STKaiti","KaiTi",serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
.btn:focus-visible,.tile:focus-visible,.lcard:focus-visible,.pk:focus-visible,.special:focus-visible{
  outline:4px solid #5FA8D3;outline-offset:3px}

/* ---------- 田字格 ---------- */
.tg{position:relative;display:block;flex:0 0 auto;width:var(--w,120px);height:var(--w,120px);
  container-type:size;background-color:#fff;border:3px solid var(--seal);border-radius:10%;overflow:hidden}
.tg::before{content:"";position:absolute;inset:0;opacity:.4;pointer-events:none;
  background:
    repeating-linear-gradient(to bottom,var(--seal) 0 4%,transparent 4% 8%) 50% 0/2px 100% no-repeat,
    repeating-linear-gradient(to right,var(--seal) 0 4%,transparent 4% 8%) 0 50%/100% 2px no-repeat}
.tg .ch{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--kai);font-weight:700;font-size:64cqw;line-height:1;color:var(--ink);
  padding-bottom:2cqw}
.tg .ch.two{font-size:38cqw;letter-spacing:-.02em}
.tg.tint1{background-color:var(--u1)} .tg.tint2{background-color:var(--u2)}
.tg.tint3{background-color:var(--u3)} .tg.tint4{background-color:var(--u4)}
.tg.tintL{background-color:var(--uL)}
@keyframes inkin{from{clip-path:inset(0 100% 0 0);opacity:.15}to{clip-path:inset(0 0 0 0);opacity:1}}
.first .tg .ch{animation:inkin .85s var(--ease) both;
  animation-delay:calc(var(--i,0)*.18s + .12s - var(--el,0s))}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.tg.breathe{animation:breathe 4.5s ease-in-out infinite}
#roles .tg{border-width:4px}
.tile .tg{--w:100%;width:100%;height:auto;aspect-ratio:1}

/* ---------- 頂欄 ---------- */
#teacher .top,#student .top,#adminv .top{background:rgba(255,255,255,.78);
  border-bottom:1px solid rgba(31,43,58,.08);box-shadow:0 1px 0 rgba(255,255,255,.9) inset}
.top .ttl{font-size:1.2rem;letter-spacing:.04em;color:var(--ink)}
.crumb{display:flex;flex-direction:column;gap:2px;min-width:0}
.homebtn{font-weight:900}
body[data-scr="home"] .lessononly,body[data-scr="unit"] .lessononly{display:none!important}
body[data-scr="home"] .homebtn{display:none!important}
body[data-scr="home"] #tPick,body[data-scr="unit"] #tPick{display:none}
body[data-scr="home"] #tTop .meta,body[data-scr="unit"] #tTop .meta{display:none}
#teacher .panel.bare{background:none;border:none;box-shadow:none;backdrop-filter:none;
  -webkit-backdrop-filter:none;padding:10px 18px 26px}

/* ---------- 選身份頁 ---------- */
#roles{gap:28px;padding:32px 24px}
.rolehero{display:flex;flex-direction:column;align-items:center;gap:14px}
.rgrid{display:flex;gap:12px}
.rgrid .tg{--w:clamp(84px,13vw,132px)}
#roles h1{font-size:clamp(2.4rem,6vw,3.6rem);letter-spacing:.3em;margin-right:-.3em;
  color:var(--ink);text-shadow:none}
#roles .rsub{color:var(--mute);font-size:1.05rem;font-weight:700;letter-spacing:.08em}
#roles .rolebtns{gap:22px;margin-top:4px}
.rolecard{display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:28px 40px;min-width:min(260px,80vw);border-radius:30px;background:rgba(255,255,255,.82);
  box-shadow:var(--hard),var(--sh);border:1px solid rgba(255,255,255,.95);
  transition:transform .12s var(--ease),box-shadow .12s}
.rolecard .ico{font-size:3rem;line-height:1}
.rolecard .t{font-size:1.55rem;font-weight:900;margin-top:4px}
.rolecard .d{font-size:.92rem;color:var(--mute);line-height:1.7}
.rolecard.rt{border-bottom:6px solid var(--u2d)}
.rolecard.rs{border-bottom:6px solid var(--u1d)}
.rolelink{font-size:.92rem;font-weight:800;color:var(--mute);padding:8px 16px;border-radius:14px;
  background:rgba(255,255,255,.5)}

/* ---------- 教師首頁 ---------- */
.home{max-width:1400px;margin:0 auto}
.homehd{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;
  margin:4px 4px 22px}
.homehd h1{font-size:clamp(2.2rem,4vw,3.4rem);font-weight:900;letter-spacing:.18em;line-height:1.1}
.homehd .hsub{color:var(--mute);font-weight:700;margin-top:8px;font-size:1.05rem}
.homehd .hday{text-align:right;color:var(--mute);font-weight:700}
.homehd .hday b{display:block;font-size:1.6rem;color:var(--ink);letter-spacing:.06em}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(14px,2vw,28px)}
.tile{position:relative;display:flex;flex-direction:column;align-items:stretch;text-align:left;
  padding:clamp(10px,1.2vw,16px);border-radius:30px;background:var(--tc);
  box-shadow:0 7px 0 var(--ts),var(--sh);border:1px solid rgba(255,255,255,.9);
  transition:transform .14s var(--ease),box-shadow .14s var(--ease)}
.tile:active{transform:translateY(6px);box-shadow:0 1px 0 var(--ts),var(--sh)}
.tile .tg{--w:100%;width:100%;height:auto;aspect-ratio:1}
.tile .tl{margin-top:14px;padding:0 4px;display:flex;flex-direction:column;gap:2px}
.tile .tl b{font-size:1.05rem;color:var(--td);letter-spacing:.14em}
.tile .tl span{font-size:clamp(1.25rem,1.9vw,1.7rem);font-weight:900;color:var(--ink);line-height:1.35}
.tile .tstat{margin:10px 4px 2px;align-self:flex-start;font-size:.92rem;font-weight:800;color:var(--td);
  background:rgba(255,255,255,.7);border-radius:14px;padding:5px 12px}
.tile.u1{--tc:var(--u1);--td:var(--u1d);--ts:#E9A9C3}
.tile.u2{--tc:var(--u2);--td:var(--u2d);--ts:#9CC7E6}
.tile.u3{--tc:var(--u3);--td:var(--u3d);--ts:#E9C766}
.tile.u4{--tc:var(--u4);--td:var(--u4d);--ts:#9ED3BA}
.tile.soon{filter:saturate(.55);opacity:.8}
.tile.soon .tstat{background:rgba(255,255,255,.55)}
.homerow{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) auto;gap:clamp(14px,2vw,26px);
  margin-top:clamp(18px,2.4vw,30px);align-items:stretch}
.special,.resume{display:flex;align-items:center;gap:18px;text-align:left;padding:14px 20px 14px 14px;
  border-radius:26px;box-shadow:0 6px 0 var(--ts),var(--sh);border:1px solid rgba(255,255,255,.9);
  background:var(--tc);transition:transform .14s var(--ease),box-shadow .14s var(--ease)}
.special{--tc:var(--uL);--td:var(--uLd);--ts:#BDA8E3}
.special:active,.resume.go:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ts),var(--sh)}
.special .tg{--w:92px}
.special .sptx,.resume .rstx{display:flex;flex-direction:column;gap:3px;min-width:0}
.special .sptx b,.resume .rstx b{font-size:1.4rem;font-weight:900;color:var(--ink)}
.special .sptx span,.resume .rstx span{font-size:.98rem;font-weight:700;color:var(--td)}
.resume{--tc:#fff;--td:var(--mute);--ts:#CFD8E4;justify-content:space-between}
.resume.none{opacity:.7;box-shadow:var(--sh);justify-content:flex-start}
.resume .rstx b{font-size:1.25rem}
.resume .rsgo{flex:0 0 auto}
.qrcard{display:flex;align-items:center;gap:14px;padding:12px 18px 12px 12px;border-radius:26px;
  background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.95);box-shadow:var(--sh);text-align:left}
.qrcard .qrsvg{width:clamp(96px,9vw,132px);cursor:zoom-in;border-radius:10px;overflow:hidden;background:#fff}
.qrcard .qct{display:flex;flex-direction:column;gap:6px}
.qrcard .qct b{font-size:1.05rem}
.qrcard .qct span{font-size:.9rem;color:var(--mute);font-weight:700;line-height:1.5}
.qrcard .qwho{display:flex;gap:4px;flex-wrap:wrap;max-width:190px}
.qrcard .qwho i{width:12px;height:12px;border-radius:50%;background:rgba(120,140,180,.28)}
.qrcard .qwho i.y{background:#7FD3B0}
@media(max-width:1000px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .homerow{grid-template-columns:1fr}
}

/* ---------- 單元頁 ---------- */
.upage{max-width:1400px;margin:0 auto}
.uhead{display:flex;align-items:center;gap:clamp(16px,2.4vw,30px);flex-wrap:wrap;
  padding:clamp(12px,1.6vw,20px);border-radius:30px;background:var(--tc);
  box-shadow:0 7px 0 var(--ts),var(--sh);border:1px solid rgba(255,255,255,.9);margin-bottom:26px}
.uhead .tg{--w:clamp(96px,11vw,150px)}
.uhead .utx{flex:1;min-width:220px}
.uhead .uno{font-size:1.05rem;font-weight:900;color:var(--td);letter-spacing:.16em}
.uhead h2{font-size:clamp(1.8rem,3.2vw,2.7rem);font-weight:900;line-height:1.25;margin-top:2px}
.uhead .uinfo{margin-top:6px;font-size:1rem;font-weight:700;color:var(--td)}
.uhead.u1{--tc:var(--u1);--td:var(--u1d);--ts:#E9A9C3}
.uhead.u2{--tc:var(--u2);--td:var(--u2d);--ts:#9CC7E6}
.uhead.u3{--tc:var(--u3);--td:var(--u3d);--ts:#E9C766}
.uhead.u4{--tc:var(--u4);--td:var(--u4d);--ts:#9ED3BA}
.uhead.uL{--tc:var(--uL);--td:var(--uLd);--ts:#BDA8E3}
.lcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:18px}
.lcard{display:flex;gap:14px;align-items:stretch;text-align:left;padding:12px;border-radius:24px;
  background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.95);
  box-shadow:0 5px 0 rgba(120,130,170,.22),var(--sh);
  transition:transform .12s var(--ease),box-shadow .12s var(--ease)}
.lcard:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(120,130,170,.22),var(--sh)}
.lcard .tg{--w:78px}
.lcard .lmain{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.lcard .ltxt{font-size:1.12rem;font-weight:800;line-height:1.6;color:var(--ink)}
.lcard .ltags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.lcard .ltag{font-size:.8rem;font-weight:800;border-radius:12px;padding:3px 10px;background:#EEF2F8;color:var(--mute)}
.lcard .ltag.ok{background:#D4F1E3;color:#17785A}
.lcard .ltag.warn{background:#FFE9C4;color:#8F5A00}
.lcard .lthumb{flex:0 0 96px;border-radius:14px;overflow:hidden;background:#EEF2F8;align-self:stretch;
  min-height:78px}
.lcard .lthumb img{width:100%;height:100%;object-fit:cover;display:block}
.soonbox{background:rgba(255,255,255,.85);border:1px dashed rgba(31,43,58,.25);border-radius:26px;
  padding:26px 28px;line-height:1.9;font-size:1.1rem;font-weight:700}
.soonbox h3{font-size:1.25rem;margin-bottom:8px}
.soonbox .pv{margin-top:14px;font-size:1.25rem;line-height:2.1;font-weight:700;color:var(--ink);
  background:rgba(255,255,255,.7);border-radius:18px;padding:14px 18px}

/* ---------- 學生：選名字 ---------- */
.spick{max-width:1100px;margin:0 auto;padding:18px 18px 40px}
.spk-head{display:flex;align-items:center;gap:20px;justify-content:center;margin:12px 0 22px;flex-wrap:wrap}
.spk-head .tg{--w:104px}
.spk-head h2{font-size:2.5rem;font-weight:900;letter-spacing:.12em}
.spk-head p{font-size:1.1rem;color:var(--mute);font-weight:700;margin-top:4px}
.lastme{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;
  background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.95);border-radius:26px;
  padding:14px 22px;box-shadow:var(--sh);max-width:640px;margin:0 auto 26px;
  font-size:1.35rem;font-weight:900}
.pick2{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:18px}
.pk{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 10px 16px;border-radius:26px;
  background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.95);
  box-shadow:0 5px 0 rgba(120,130,170,.22),var(--sh);
  transition:transform .12s var(--ease),box-shadow .12s var(--ease)}
.pk:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(120,130,170,.22),var(--sh)}
.pk .tg{--w:96px;background-color:var(--c,#fff)}
.pk .pn{font-size:1.2rem;font-weight:900}
.pk.me{outline:4px solid #7FD3B0;outline-offset:2px}
.spick .diag{margin-top:26px;text-align:center}

/* ---------- 學生：等老師 ---------- */
.swait{display:flex;flex-direction:column;align-items:center;gap:18px;padding:clamp(30px,8vh,80px) 20px;
  text-align:center}
.swait .tg{--w:clamp(120px,22vw,180px)}
.swait .t{font-size:2rem;font-weight:900;letter-spacing:.06em}
.swait .d{font-size:1.05rem;color:var(--mute);font-weight:700}
.swait .uchip{display:inline-flex;align-items:center;gap:10px;border-radius:20px;padding:8px 16px 8px 8px;
  background:var(--tc);font-weight:900;font-size:1.1rem}
.swait .uchip .tg{--w:44px;border-width:2px;border-radius:8px}
.swait .uchip.u1{--tc:var(--u1)} .swait .uchip.u2{--tc:var(--u2)} .swait .uchip.u3{--tc:var(--u3)}
.swait .uchip.u4{--tc:var(--u4)} .swait .uchip.uL{--tc:var(--uL)}

/* ---------- 總結算（取代原本的獎品店） ---------- */
.settle-note{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

/* ---------- 安靜模式 / 減少動態 ---------- */
body.calm *,body.calm *::before,body.calm *::after{animation:none!important;transition:none!important}
body.calm #cheer .big,body.calm #cheer h2{animation:none!important}
body.calm .first .tg .ch{clip-path:none;opacity:1}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

.lcard.cur{outline:3px solid #F4B740;outline-offset:2px}
#cheer.calm{inset:auto;top:18px;left:50%;transform:translateX(-50%);width:auto;flex-direction:row;gap:12px;
  padding:10px 24px;border-radius:22px;background:rgba(127,211,176,.96);box-shadow:var(--sh)}
#cheer.calm .big{font-size:1.7rem}
#cheer.calm h2{font-size:1.25rem;margin:0}
.lastme b{font-size:1.5rem}

/* 頂欄收窄：電視上不折行 */
#teacher .top{gap:10px;padding:8px 16px}
#teacher .top .dot{width:10px;height:10px}
#teacher .top select{max-width:min(34vw,330px)}
@media(max-width:1500px){#tDots{display:none}}

/* ==================================================================
   第二階段：單元二的題目卡、句子教學卡、課文影片
   設計重點：整個單元二以「藍」為主色（和單元卡片一致），
   句子成分用固定顏色（名詞藍、動作粉紅、地點黃…），同學看顏色就記得句子結構。
   ================================================================== */
:root{
  --c1:#CDE6F8; --c1d:#6AAEDC;
  --c2:#FBD5E4; --c2d:#E48BAE;
  --c3:#FFE7A0; --c3d:#E2B93C;
  --c4:#D2EFE0; --c4d:#6BC09C;
  --c5:#E3D6F6; --c5d:#A58AD8;
  --c6:#FFD9C2; --c6d:#F0A06F;
}

/* ---------- 題目（共用） ---------- */
.it .it-q{font-size:1.95rem;font-weight:900;line-height:2.25;color:var(--ink);text-align:center}
.it .it-q .tr{display:block;font-size:1.05rem;line-height:1.5;font-weight:700;color:var(--mute);margin-top:4px}
.it .it-cue{display:inline-block;margin:6px auto 2px;padding:6px 18px;border-radius:18px;background:#fff;
  border:3px dashed #9CC7E6;font-size:1.5rem;font-weight:900;letter-spacing:.06em;color:#1B63A0}
.it{text-align:center}
.it .it-pic{display:block;margin:10px auto 4px;width:min(300px,86%);border-radius:18px;border:4px solid #fff;
  box-shadow:var(--sh,0 6px 18px rgba(31,43,58,.12))}
.it .it-em{font-size:4.6rem;line-height:1.2;margin:4px 0}
.it .it-say{margin:8px 0 2px}
.it-tag{display:inline-block;font-size:.78rem;font-weight:900;padding:2px 12px;border-radius:20px;
  background:#DCEEF9;color:#1B63A0;vertical-align:middle;margin-left:4px}
.it-opts{margin-top:14px}
.it-opts .opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:84px}
.it-opts .opt .o-t{font-size:1.5rem;font-weight:900}
.it-opts .opt .o-em{font-size:3rem;line-height:1.1}
.it-opts .opt img{width:100%;max-width:210px;aspect-ratio:4/3;object-fit:cover;border-radius:12px}
.it-opts.pe .opt{min-height:130px}
.it-opts .opt.wrongkeep{border-color:#E7746A;background:#FFF0EE}
.it-opts .opt.right{animation:u2pop .45s var(--ease)}
@keyframes u2pop{0%{transform:scale(.94)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
.sorthint{margin:10px 0 4px;font-size:1.05rem;font-weight:800;color:var(--mute)}
.fillstep{margin:6px 0 0;font-size:.95rem;font-weight:800;color:var(--mute)}

/* 對／不對 */
.tfrow{display:flex;gap:20px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.tfb{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:200px;padding:16px 28px;
  border-radius:26px;border:5px solid;font-weight:900;cursor:pointer;transition:transform .12s}
.tfb:active{transform:translateY(3px) scale(.98)}
.tfb.yes{background:#EAFAF2;border-color:#7FD3B0;color:#1E8E62}
.tfb.no{background:#FFF0EE;border-color:#F0A19A;color:#C0463B}
.tfb .tfi{font-size:3.4rem;line-height:1.1}
.tfb .tft{font-size:1.7rem}
.tfb.right{box-shadow:0 0 0 6px rgba(127,211,176,.55);animation:u2pop .45s var(--ease)}
.tfb.wrongkeep{opacity:.5}

/* 排句子 */
.chip{display:inline-flex;align-items:center;justify-content:center;font-size:1.65rem;font-weight:900;line-height:2;
  padding:4px 20px;border-radius:20px;background:#fff;border:4px solid #A9CDEA;color:var(--ink);cursor:pointer;
  box-shadow:0 4px 0 #A9CDEA;transition:transform .1s,box-shadow .1s}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 #A9CDEA}
.chip:disabled,.chip.used{opacity:.35;box-shadow:none;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:16px;min-height:62px}
.orderline{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin:16px 0 4px;
  padding:16px 14px;border-radius:22px;background:rgba(255,255,255,.7);border:3px dashed #BBD6EC}
.orderline .given{font-size:1.65rem;font-weight:900;line-height:2;padding:4px 18px;border-radius:20px;background:#E4EDF6;color:#4D6276}
.orderline .slot{display:inline-block;min-width:96px;height:68px;border-radius:18px;border:4px dashed #BBD6EC;background:rgba(255,255,255,.6)}
.orderline .slot.next{border-color:#F4B740;animation:u2pulse 1.4s ease-in-out infinite}
@keyframes u2pulse{0%,100%{box-shadow:0 0 0 0 rgba(244,183,64,.45)}50%{box-shadow:0 0 0 8px rgba(244,183,64,0)}}
.orderline .chip.placed{background:#FFF6DC;border-color:#F4B740;box-shadow:0 4px 0 #F4B740}
.orderline .chip.placed.ok{background:#EAFAF2;border-color:#7FD3B0;box-shadow:0 4px 0 #7FD3B0}
.doneword{font-size:2.4rem}

/* 填充 */
.fillq .blank{display:inline-block;min-width:104px;height:1.5em;vertical-align:middle;margin:0 6px;
  border-bottom:6px solid #7FB6D9;border-radius:6px 6px 0 0;background:rgba(255,255,255,.55)}
.fillq .blank.now{border-bottom-color:#F4B740;background:#FFF6DC;animation:u2pulse 1.4s ease-in-out infinite}
.fillq .blank.filled{border-bottom-color:#7FD3B0;background:#EAFAF2;color:#1E8E62}

/* 分類 */
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:16px}
.bucket{display:flex;flex-direction:column;gap:10px;min-height:150px;padding:12px;border-radius:24px;border:4px solid;
  text-align:center;cursor:pointer;background:var(--bg);border-color:var(--bd)}
.bucket:nth-child(4n+1){--bg:#E8F3FC;--bd:#9CC7E6}
.bucket:nth-child(4n+2){--bg:#FDEAF2;--bd:#E9A6C1}
.bucket:nth-child(4n+3){--bg:#FFF6D8;--bd:#E8C766}
.bucket:nth-child(4n+4){--bg:#E6F6EE;--bd:#8CCDAE}
.bucket .bk-h{display:flex;align-items:center;justify-content:center;gap:10px}
.bucket .bk-ico{font-size:2.2rem;line-height:1}
.bucket .bk-lb{font-size:1.45rem;font-weight:900;color:var(--ink)}
.bucket .bk-in{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-content:flex-start;min-height:56px}
.bucket.ready{animation:u2glow 1.3s ease-in-out infinite}
@keyframes u2glow{0%,100%{box-shadow:0 0 0 0 rgba(244,183,64,.5)}50%{box-shadow:0 0 0 9px rgba(244,183,64,0)}}
.cards{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:12px}
.card{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 14px;min-width:120px;border-radius:20px;
  background:#fff;border:4px solid #C8D8EB;cursor:pointer;box-shadow:0 4px 0 #C8D8EB;transition:transform .1s}
.card:active{transform:translateY(3px)}
.card img{width:120px;height:90px;object-fit:cover;border-radius:12px}
.card .o-em{font-size:3rem;line-height:1.1}
.card .c-t{font-size:1.3rem;font-weight:900}
.card.sel{border-color:#F4B740;background:#FFF6DC;box-shadow:0 0 0 6px rgba(244,183,64,.4);transform:translateY(-4px)}
.mini{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:16px;background:#fff;
  border:3px solid rgba(31,43,58,.1);font-size:1.15rem;font-weight:900}
.mini img{width:44px;height:34px;object-fit:cover;border-radius:8px}
.mini .o-em{font-size:1.5rem}

/* 配對 */
.matchwrap{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;margin-top:16px;align-items:start}
.mlefts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.mrights{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.mleft{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;border-radius:20px;background:#fff;
  border:4px solid #C8D8EB;cursor:pointer;box-shadow:0 4px 0 #C8D8EB}
.mleft img{width:100%;max-width:150px;aspect-ratio:4/3;object-fit:cover;border-radius:12px}
.mleft .o-em{font-size:3rem;line-height:1.1}
.mleft .c-t{font-size:1.2rem;font-weight:900}
.mleft .mans{min-width:110px;min-height:2.2em;border-radius:12px;border:3px dashed #BBD6EC;background:#F4F9FD;font-size:1.2rem;
  font-weight:900;display:flex;align-items:center;justify-content:center;color:#9AA9B9;padding:0 8px}
.mleft.sel{border-color:#F4B740;background:#FFF6DC;box-shadow:0 0 0 6px rgba(244,183,64,.4)}
.mleft.done{border-color:#7FD3B0;background:#EAFAF2;box-shadow:0 4px 0 #7FD3B0}
.mleft.done .mans{border-style:solid;border-color:#7FD3B0;background:#fff;color:#1E8E62}

/* 多選 */
.it-multi .opt.pickd::after,.it-multi .opt.right::after{content:"✔";position:absolute;top:8px;right:12px;font-size:1.5rem;color:#1E8E62}
.it-multi .opt{position:relative}

/* 說話 */
.talkbox{padding:12px 6px}
.talkbox .talkico{font-size:3.4rem}
.talkbox .talknote{margin-top:6px;font-size:1.15rem;font-weight:800;color:var(--mute)}
.tiptv{display:inline-block;margin-top:12px;padding:8px 18px;border-radius:16px;background:#FFF3CD;font-weight:800;color:#8A5B12}

/* 答案揭曉 */
.ansboard{margin-bottom:16px;border:3px solid #7FD3B0!important;background:rgba(233,250,243,.92)!important}
.ansbig{font-size:2.3rem;font-weight:900;line-height:2.1;color:#1E8E62;text-align:center}

/* ---------- 句子教學卡 ---------- */
.tcard{padding:6px 4px 10px;text-align:center}
.tcard.fresh{animation:u2in .45s var(--ease) both}
@keyframes u2in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tnote{margin:14px auto 0;max-width:760px;padding:10px 18px;border-radius:16px;background:rgba(255,243,205,.85);
  border:2px dashed #F4C95D;font-size:1.12rem;font-weight:800;line-height:2.1;color:#6B4A0B}

.striprow{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;margin:16px 0}
.sthumb{width:130px;height:98px;object-fit:cover;border-radius:16px;border:4px solid #fff;box-shadow:0 5px 14px rgba(31,43,58,.14)}
.strips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.strip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 20px 6px;border-radius:20px;border:4px solid;
  cursor:pointer;min-width:100px;box-shadow:0 5px 0 rgba(31,43,58,.1);transition:transform .1s}
.strip:active{transform:translateY(3px)}
.strip .st-t{font-size:1.9rem;font-weight:900;line-height:2.2;color:var(--ink)}
.strip .st-l{font-size:.9rem;font-weight:900;color:rgba(31,43,58,.62)}
.strip.c1{background:var(--c1);border-color:var(--c1d)} .strip.c2{background:var(--c2);border-color:var(--c2d)}
.strip.c3{background:var(--c3);border-color:var(--c3d)} .strip.c4{background:var(--c4);border-color:var(--c4d)}
.strip.c5{background:var(--c5);border-color:var(--c5d)} .strip.c6{background:var(--c6);border-color:var(--c6d)}
.tcard.fresh .strip{animation:u2in .5s var(--ease) both;animation-delay:calc(var(--i,0)*.14s)}

.compwrap{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;margin:14px auto;max-width:900px}
.tg.big{--w:150px}
.tg.satg{--w:84px}
.compr{display:grid;grid-template-columns:repeat(2,auto);gap:12px}
.sat{padding:0;border:none;background:none;cursor:pointer;border-radius:12px;transition:transform .12s}
.sat.on{transform:scale(1.12);filter:drop-shadow(0 0 0 #F4B740)}
.sat.on .tg{border-color:#F4B740;box-shadow:0 0 0 5px rgba(244,183,64,.45)}
.compm{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.eqhint{font-size:1.1rem;font-weight:800;color:var(--mute)}
.eq{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;animation:u2in .35s var(--ease)}
.eqc{font-family:var(--kai);font-size:2.8rem;font-weight:700}
.eqp{font-size:2rem;font-weight:900;color:var(--seal)}
.eqw{font-size:2.4rem;font-weight:900;padding:2px 22px;border-radius:20px;background:#fff;border:4px solid #7FD3B0;cursor:pointer}
.eqpic img{width:150px;height:112px;object-fit:cover;border-radius:16px;border:4px solid #fff;box-shadow:0 5px 14px rgba(31,43,58,.14)}
.o-em.big{font-size:4rem}

.rulewrap{display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap;margin:10px 0}
.ruleico{font-size:4.4rem;line-height:1}
.rulelines{text-align:left}
.rl{font-size:1.65rem;font-weight:900;line-height:2.3}
.rulechips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:10px}
.rchip{display:flex;align-items:center;gap:8px;padding:6px 16px 6px 8px;border-radius:20px;background:#fff;border:4px solid #C8D8EB;
  font-size:1.4rem;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #C8D8EB}
.rchip img{width:64px;height:48px;object-fit:cover;border-radius:10px}

.saywrap{display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap;margin:10px 0}
.saypic{width:220px;border-radius:18px;border:4px solid #fff;box-shadow:0 5px 14px rgba(31,43,58,.14)}
.saylines{text-align:left}

.jprow{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;margin:16px 0}
.jtiles{display:flex;gap:8px}
.jtile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 4px 6px;border-radius:16px;
  background:rgba(255,255,255,.7);border:3px solid #C8D8EB;cursor:pointer}
.jtile .jp{font-size:1.55rem;font-weight:900;letter-spacing:.02em;color:#1B63A0;line-height:1.4;min-height:1.4em}
.jtile .jp .ini{color:var(--seal)}
.jtg{--w:92px}

/* ---------- 課文頁（大圖書；L9／L10 只顯示上／下半） ---------- */
.pgs{display:flex;flex-direction:column;gap:12px;width:min(470px,100%)}
.stu .pgs{width:100%}
.pgs .pg{position:relative;overflow:hidden;border-radius:22px;border:5px solid #fff;box-shadow:var(--sh);background:#fff}
.pgs .pg img{display:block;width:100%;border:none!important;box-shadow:none!important;border-radius:0!important}
.pgs .pg.crop-top,.pgs .pg.crop-bottom{aspect-ratio:441/111}
.pgs .pg.crop-top img,.pgs .pg.crop-bottom img{position:absolute;left:0}
.pgs .pg.crop-top img{top:0}
.pgs .pg.crop-bottom img{bottom:0}

/* ---------- 課文影片 ---------- */
.vid{background:radial-gradient(120% 120% at 20% 0%,#1B2E4A 0%,#0F1B2D 60%);border-radius:28px;padding:16px 20px 20px;color:#fff;
  display:flex;flex-direction:column;gap:12px;min-height:calc(100vh - 118px)}
.vtop{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.vtitle{font-weight:900;font-size:1.2rem;flex:1;letter-spacing:.04em}
.vcnt{font-weight:800;color:#9DB6D3;font-variant-numeric:tabular-nums}
.vprog{display:flex;gap:4px;width:100%;order:9}
.vprog i{flex:1;height:9px;border-radius:5px;background:rgba(255,255,255,.18);cursor:pointer;transition:background .25s}
.vprog i.past{background:#5FA8D3}
.vprog i.cur{background:#FFD36B}
.vscreen{flex:1;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:12px;min-height:0}
.vframe{position:relative;overflow:hidden;border-radius:22px;background:#0a1220;height:min(43vh,430px);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 14px 36px rgba(0,0,0,.35);border:4px solid rgba(255,255,255,.12)}
.vbox{height:100%;max-width:100%;aspect-ratio:var(--ar,1.6);overflow:hidden;position:relative;background:#fff}
.vbox img{position:absolute;inset:0;width:100%;height:100%;display:block;transform-origin:50% 50%;
  transition:transform .9s var(--ease)}
.vframe img.kb{animation:u2kb 9s ease-out both}
@keyframes u2kb{from{transform:scale(1)}to{transform:scale(1.07)}}
.vid[data-fx="tl"] #vSlide{transform-origin:0 0;transform:scale(2);animation:none}
.vid[data-fx="tr"] #vSlide{transform-origin:100% 0;transform:scale(2);animation:none}
.vid[data-fx="bl"] #vSlide{transform-origin:0 100%;transform:scale(2);animation:none}
.vid[data-fx="br"] #vSlide{transform-origin:100% 100%;transform:scale(2);animation:none}
#vSlide[data-s="10"]{animation:none}
.vsubwrap{position:relative}
.vsub{min-height:3.4em;display:flex;align-items:center;justify-content:center;text-align:center;flex-wrap:wrap;
  font-size:2.5rem;font-weight:900;line-height:2.1;padding:6px 20px;border-radius:20px;background:rgba(255,255,255,.08)}
.vsub rt{font-size:.38em;color:#B8CCE2;font-weight:700}
.vsub .vk{color:#FFD36B;background:rgba(255,211,107,.14);border-radius:10px;padding:0 6px}
.vsub .vk rt{color:#FFE5A3}
.vsub.pop{animation:u2sub .28s var(--ease)}
@keyframes u2sub{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.vhide{opacity:.35;font-size:1.6rem}
.vbarwrap{height:6px;border-radius:3px;background:rgba(255,255,255,.14);margin-top:8px;overflow:hidden}
.vbar{height:100%;width:0;background:linear-gradient(90deg,#5FA8D3,#FFD36B);border-radius:3px}
@keyframes vbar{from{width:0}to{width:100%}}
.vecho{position:absolute;right:16px;top:-16px;padding:8px 20px;border-radius:20px;background:#FFD36B;color:#5A3B00;font-weight:900;
  font-size:1.3rem;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .2s,transform .2s}
.vecho.show{opacity:1;transform:none}
.vctl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.vctl .btn.big{font-size:1.5rem;padding:12px 34px}
.vsep{width:2px;height:34px;background:rgba(255,255,255,.2);margin:0 6px}
.vid .btn.holdon{background:#FFD36B;color:#5A3B00}
.vend{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,18,32,.78)}
.vend.show{display:flex;animation:u2in .4s var(--ease)}
.vend-in{text-align:center}
.vend-em{font-size:4rem}
.vend-t{font-size:2rem;font-weight:900;margin:6px 0 16px}

/* 學生版影片 */
.svid .vframe{height:auto;border:4px solid #fff;background:#fff}
.svid .vbox{height:auto;width:100%}
.svid .vsub.s{background:rgba(255,255,255,.75);color:var(--ink);font-size:1.9rem;margin-top:12px}
.svid .vsub.s rt{color:#4D6276}
.svid .vsub.s .vk{color:#8A5B12;background:#FFF0C4}
.svid .vsub.pop{animation:u2sub .28s var(--ease)}

/* ---------- 安靜模式：關閉單元二的動畫 ---------- */
body.calm .vid *,body.calm .tcard,body.calm .tcard *,body.calm .it *{animation:none!important;transition:none!important}

@media (max-width:760px){
  .compwrap{grid-template-columns:1fr}
  .matchwrap{grid-template-columns:1fr}
  .it .it-q{font-size:1.6rem}
  .vsub{font-size:1.6rem}
  .vbox{height:auto;width:100%}
}
@media (prefers-reduced-motion: reduce){
  .vid *,.tcard,.tcard *,.it *{animation:none!important;transition:none!important}
}

body[data-scr="video"] .lessononly{display:none!important}
body[data-scr="video"] #tPick,body[data-scr="video"] #tTop .meta{display:none}
</style>
</head>

async function gtx(text){
  if(!text) return null;
  if(TRC[text]!=null) return TRC[text];
  try{
    const r = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q='
      + encodeURIComponent(text));
    if(!r.ok) return null;
    const j = await r.json();
    const out = (j[0]||[]).map(x=>(x&&x[0])||'').join('').trim();
    if(out){ TRC[text]=out; localStorage.setItem('zw26.trc', JSON.stringify(TRC)); return out; }
  }catch(e){}
  return null;
}

   已填網址 → Google Apps Script ＋ 試算表，全班平板電腦即時同步

/* 後端（Apps Script ＋ 你的 Google 試算表）網址。
   寫死在此，平板電腦開啟網頁即已連線，不用逐部設定。
   將來若重新建立部署而網址改變，只需改這一行。 */
const GAS_KEY = '4ljDXzzrP_5n3d36d4GGZ20H';   /* 後端鎖匙：擋走隨機掃描 */
const GAS_DEFAULT = 'https://script.google.com/macros/s/AKfycbwMYIoh8NSdqmUAmEoDFOtoyJ3V_tXBcFkylvg8iNPMmdf7SYFADkbqU3_u-lcohWZ8/exec';
const NET = {
  url: localStorage.getItem(K+'.url') || window.__GAS_URL__ || GAS_DEFAULT,
  auto: !localStorage.getItem(K+'.url'),
  v: -1, t: 0, pulled:false, busy:false, q:[], status:'local', lastErr:'',
  seen:{}, sending:false, beat:'', beating:false, fails:0, lastMs:0, log:[],
  on(){ return !!this.url; },
  setUrl(u){
    this.url = (u||'').trim();
    if(this.url) localStorage.setItem(K+'.url', this.url);
    else { localStorage.removeItem(K+'.url'); this.url = window.__GAS_URL__ || GAS_DEFAULT; }
    this.auto = !localStorage.getItem(K+'.url');
    this.v = -1; this.t = 0; this.pulled = false; this.status = this.url ? 'connecting' : 'local';
    render();
  },
  async call(body, ms){
    body = Object.assign({k: GAS_KEY}, body);   /* 每個請求都帶鎖匙 */
    const ctl = new AbortController();
    const timer = setTimeout(()=>ctl.abort(), ms||25000);
    const t0 = Date.now();
    try{
      const r = await fetch(this.url, {method:'POST', redirect:'follow', signal:ctl.signal,
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify(body)});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const out = await r.json();
      this.note(body.fn, Date.now()-t0, true);
      return out;
    } catch(e){
      this.note(body.fn, Date.now()-t0, false);
      throw e;
    } finally { clearTimeout(timer); }
  },
  /* 記低每次來回耗時，方便睇出慢喺邊 */
  note(fn, ms, ok){
    if(fn==='sync' || fn==='push') this.lastMs = ms;
    this.log.unshift({fn, ms, ok, at:new Date().toLocaleTimeString('zh-HK')});
    if(this.log.length > 12) this.log.pop();
    document.querySelectorAll('.netms').forEach(e=> e.textContent = msLabel());
  },
  push(key, obj){
    if(!this.on()) return;
    this.q = this.q.filter(x=>x.key!==key);   /* 同一格只留最新一次 */
    this.q.push({key, data:obj});
    this.sending = true; paintSend();
    setTimeout(()=>this.tick(), 0);           /* 即刻傳，唔等下一次輪詢 */
  },
  /* 學生報到：話畀老師知自己已經跳到邊一頁。
     刻意用獨立指令，唔會更新版本號，所以唔會令全班重新同步。
     ⚠️ 必須防止重複發送：瀏覽器對同一網域只准約六條連線，
        報到請求一旦疊住晒，同步請求就攞唔到連線，學生機會好似死咗咁。 */
  async sendBeat(){
    if(!this.on() || ROLE!=='s' || !ME) return;
    if(this.beating || this.busy) return;      /* 有報到未完、或正在同步，就唔好插隊 */
    const s = phaseKey();
    if(s === this.beat) return;
    const prev = this.beat;
    this.beat = s;                             /* 先記低，避免同一頁重複發 */
    this.beating = true;
    try{ await this.call({fn:'beat', me:ME, s}, 15000); }
    catch(e){ this.beat = prev; }              /* 失敗就還原，下次重試 */
    finally{ this.beating = false; }
  },
  async txAdd(rows){
    if(!this.on() || !rows.length) return;
    try{ await this.call({fn:'tx', rows}, 20000); }catch(e){}
  },
  async txList(n){
    if(!this.on()) return [];
    try{ const r = await this.call({fn:'txlist', n:n||30}, 20000);
         return (r && r.rows) || []; }catch(e){ return []; }
  },
  async tick(){
    if(!this.on() || this.busy) return;
    this.busy = true;
    try{
      while(this.q.length){
        const it = this.q[0];
        const res = await this.call({fn:'push', key:it.key, data:it.data});
        if(!res || !res.ok) throw new Error(res && res.err || 'push failed');
        this.q.shift();
        /* 注意：唔可以喺呢度更新 this.v。
           上傳成功後如果當自己已經最新，就會永遠唔落去攞其他資料
           （例如全新平板永遠攞唔到學生名單）。留返畀下面對版本號時觸發下載。 */
      }
      /* 一次來回搞掂：帶住自己嘅版本號同上次同步時間，
         冇變就只回一個版本號；有變就順便把「變咗嗰幾格」一齊送返。 */
      const res = await this.call({fn:'sync', v:this.v, t:(this.pulled ? this.t : 0),
                                   role:ROLE, me:ME}, 25000);
      if(res && res.ok){
        if(res.seen) this.seen = res.seen;
        if(res.data && Object.keys(res.data).length){
          for(const [key,val] of Object.entries(res.data)){
            if(!key.startsWith(K)) continue;
            /* 自己的答案格：如果本機仲有未傳上去的新內容，或者正在打字，
               就唔好用雲端舊版蓋過，否則同學啱啱寫的會不見了 */
            if(ME && key===KA(ME) && (TYPING || COMPOSING || this.q.some(x=>x.key===key))) continue;
            localStorage.setItem(key, JSON.stringify(val));
          }
          pullAll(); renderSafe();
        }
        this.v = res.v; if(res.t) this.t = res.t;
        this.pulled = true;
      }
      this.fails = 0;
      if(this.status!=='ok'){ this.status='ok'; render(); }
      this.lastErr='';
      if(!this.q.length && this.sending){ this.sending=false; paintSend(); }
    }catch(e){
      this.lastErr = String(e.message||e);
      /* 網絡有時會慢或抖一抖。一次唔通就報「中斷」會嚇親人，
         連續兩次先當中斷，中間顯示「較慢」。 */
      this.fails++;
      const want = this.fails >= 2 ? 'err' : 'slow';
      if(this.status !== want){ this.status = want; try{ render(); }catch(_){} }
    }finally{
      /* 必須在 finally 重設：否則畫面一旦出錯，同步會就此停頓，整堂課失聯 */
      this.busy = false;
      if(!this.q.length && this.sending){ this.sending=false; paintSend(); }
    }
  }
};

function pickOpts(word, lv){
  const pool = unitWords().filter(w=>w!==word);
  const n = (NOPT[lv]||3)-1;
  let seed=0; for(const c of word) seed += c.charCodeAt(0);
  const picked=[];
  for(let i=0;i<n && pool.length;i++) picked.push(pool.splice((seed*(i+7))%pool.length,1)[0]);
  return [word,...picked].sort((a,b)=>((seed+a.charCodeAt(0))%7)-((seed+b.charCodeAt(0))%7));
}

/* ---------- 課文朗讀：可暫停、可繼續，並像卡拉OK般逐詞轉紅 ----------
   以計時器為主軸（每個字時長一致），boundary 事件只用來校正，
   這樣即使瀏覽器不派中文 boundary，也不會有字漏了不著色。
   老師按朗讀時會把開始時間廣播出去，學生機各自跑同一條時間線。 */
const READ = {on:false, paused:false, idx:-1, timer:null, t0:0, pausedAt:0, offset:0, lens:[], sentence:''};
function readMarks(){ return document.querySelectorAll('.readline w'); }
function paintRead(){
  readMarks().forEach((el,i)=> el.classList.toggle('reading', i===READ.idx));
}
function readLens(){
  return [...readMarks()].map(el => Math.max(1, +(el.dataset.len||1)));
}
function stopRead(local){
  if(READ.timer){ clearInterval(READ.timer); READ.timer=null; }
  READ.on=false; READ.paused=false; READ.idx=-1;
  try{ speechSynthesis.cancel(); }catch(e){}
  paintRead(); syncReadBtn();
  if(!local && ROLE==='t'){ CTRL.read=null; saveCtrl(); }
}
const MS_PER_CHAR = 430;          /* rate .72 下每字大約需時 */
function runReadTimer(){
  if(READ.timer) clearInterval(READ.timer);
  READ.timer = setInterval(()=>{
    if(READ.paused) return;
    const el = Date.now() - READ.t0 + READ.offset;
    let acc=0, idx=-1;
    for(let i=0;i<READ.lens.length;i++){
      acc += READ.lens[i]*MS_PER_CHAR;
      if(el < acc){ idx=i; break; }
    }
    if(idx===-1){ stopRead(true); return; }
    if(idx!==READ.idx){ READ.idx=idx; paintRead(); }
  }, 80);
}
function beginRead(sentence, t0, offset){
  READ.on=true; READ.paused=false; READ.sentence=sentence;
  READ.lens = readLens(); READ.idx=0; READ.t0=t0||Date.now(); READ.offset=offset||0;
  paintRead(); runReadTimer(); syncReadBtn();
}
function startRead(sentence){
  const marks = readMarks();
  if(!marks.length) return speak(sentence);
  try{ speechSynthesis.cancel(); }catch(e){}
  beginRead(sentence, Date.now(), 0);

  const u = new SpeechSynthesisUtterance(sentence);
  u.lang='zh-HK'; u.rate=.72; if(VOICE) u.voice=VOICE;
  /* boundary 只做校正：把時間線拉回真正讀到的位置 */
  u.onboundary = e=>{
    if(e.charIndex==null || READ.paused) return;
    let acc=0, idx=0;
    for(let i=0;i<READ.lens.length;i++){ acc+=READ.lens[i]; if(e.charIndex<acc){ idx=i; break; } idx=i; }
    let want=0; for(let i=0;i<idx;i++) want += READ.lens[i]*MS_PER_CHAR;
    READ.offset = want - (Date.now()-READ.t0);
    if(idx!==READ.idx){ READ.idx=idx; paintRead(); }
  };
  /* 有些情況下語音會立刻結束（分頁在背景、沒有語音檔、自動播放被擋），
     此時仍要讓時間線跑完，否則同學就跟不到高亮。 */
  u.onend = ()=>{
    const lens = READ.lens.length?READ.lens:readLens();
    const total = lens.reduce((a,b)=>a+b,0) * MS_PER_CHAR;
    const el = Date.now() - READ.t0 + READ.offset;
    if(el >= total - 400) stopRead();
  };
  speechSynthesis.speak(u);

  if(ROLE==='t'){
    CTRL.readSeq = (CTRL.readSeq||0) + 1;       /* 單調遞增，停止後再讀仍是新一次 */
    CTRL.read = {s:sentence, t0:READ.t0, seq:CTRL.readSeq};
    saveCtrl();
  }
}
function toggleRead(sentence){
  if(!READ.on) return startRead(sentence);
  if(READ.paused){
    speechSynthesis.resume(); READ.paused=false;
    READ.offset -= (Date.now() - READ.pausedAt);
  } else {
    speechSynthesis.pause(); READ.paused=true; READ.pausedAt=Date.now();
  }
  if(ROLE==='t'){ CTRL.read = READ.paused
    ? {...CTRL.read, pause:READ.pausedAt}
    : {...CTRL.read, pause:0, t0:READ.t0, off:READ.offset};
    saveCtrl(); }
  syncReadBtn();
}
function syncReadBtn(){
  document.querySelectorAll('.readbtn').forEach(b=>{
    b.textContent = !READ.on ? '🔊 朗讀全句' : (READ.paused ? '▶️ 繼續朗讀' : '⏸ 暫停');
  });
  document.querySelectorAll('.stopbtn').forEach(b=> b.classList.toggle('hide', !READ.on));
}
/* 學生機：跟著老師的時間線跑同一條高亮（不出聲，只著色） */
let LAST_READ_SEQ = 0;
function followRead(){
  if(ROLE!=='s') return;
  const r = CTRL.read;
  if(!r){ if(READ.on) stopRead(true); return; }
  const fresh = r.seq !== LAST_READ_SEQ;
  /* 同一次朗讀但畫面重繪過（例如剛換頁），只要時間線未跑完就補跑 */
  const stale = !READ.on && !fresh && withinTimeline(r);
  if((fresh || stale) && readMarks().length){
    LAST_READ_SEQ = r.seq;
    beginRead(r.s, r.t0, r.off||0);
  }
  if(READ.on) READ.paused = !!r.pause;
}
function withinTimeline(r){
  const lens = readLens(); if(!lens.length) return false;
  const total = lens.reduce((a,b)=>a+b,0) * MS_PER_CHAR;
  return (Date.now() - r.t0 + (r.off||0)) < total;
}
function tokenize(sen, keys){
  const out=[]; let i=0; const sorted=[...keys].sort((a,b)=>b.length-a.length);
  outer: while(i<sen.length){
    for(const k of sorted){ if(sen.startsWith(k,i)){ out.push({t:k,key:true}); i+=k.length; continue outer; } }
    out.push({t:sen[i],key:false}); i++;
  }
  return out;
}
function enOf(w){
  for(const l of lessons()){ const v=l.vocab.find(x=>x.w===w); if(v&&v.en) return v.en; }
  return null;
}
function gPrompt(word){
  return `請以50字內的中文及英文簡單解釋「${word}」，並朗讀出來。`

function copyGemini(word, btn){

function fallbackCopy(txt, cb){
  const ta=document.createElement('textarea'); ta.value=txt;

}

function wsEn(t){ const b=t.replace(/（[二三四]）$/,'').replace(/「.*」$/,''); return WS_EN[b]||WS_EN[t]||''; }

function wsTrackOf(s){ return (s.ws!==undefined && s.ws!==null) ? s.ws : (s.lv==1 ? 'H' : 'M'); }
function wsVarOf(s){   return s.wv || ({0:'copy', 1:'grey', 2:'big'})[s.wlv] || 'copy'; }
/* 而家做緊邊一套：本連堂，定係成個單元完結後嗰批 */
function wsSet(){ return CTRL.wsEnd ? 'end' : L().no; }
function wsSetName(set){ return set==='end' ? '單元完結工作紙' : `第 ${set} 連堂工作紙`; }

/* 某學生喺某一套要做嘅工作紙，已按次序排好 */
function wsList(s, set){
  const tr = wsTrackOf(s); if(!tr) return [];
  const src = ((WS[set]||{})[tr]) || [];
  const out = [];
  src.forEach(it=>{
    if(it.v) (it.v[wsVarOf(s)] || []).forEach(x=>out.push(x));
    else out.push(it);
  });
  return out;
}
/* 狀態：0 未做　1 學生話做完（🙋）　2 老師確認（✔） */
/* 由短編號搵返工作紙（標題、檔名、資料夾）*/
function wsItemById(id){
  for(const key in WS) for(const tr in WS[key]) for(const x of WS[key][tr]){
    if(x.v){ for(const k in x.v) for(const y of x.v[k]) if(y.id===id) return y; }
    else if(x.id===id) return x;
  }

/* ==================================================================
   工作紙檢視器 —— 直接喺程式入面做工作紙
   ------------------------------------------------------------------
   張工作紙就係 Drive 嗰份本身（Word → PDF → 圖），所以樣一模一樣，
   同學返到屋企見到張紙都係同一個樣。
   圖上面疊住一塊透明畫布，可以好似小畫家咁寫字、圈、擦。
   筆跡用座標存喺學生部機（localStorage），唔上雲端 ——
   一版工作紙嘅筆跡太大，會塞爆試算表嗰格。
   ================================================================== */
let WSV = null;   /* {id, tool, zoom} 開緊嘅工作紙 */
let WS_POS = null; /* 工作紙拉到邊度：{id, t:上下, l:左右}，重畫後用嚟拉返去 */
let WS_HTML = '';  /* 上一次砌好嘅工作紙畫面，用嚟判斷有冇變 */
/* 【修正：拉桿過幾秒彈返頂】
   網絡同步、連線狀態轉變等等，都會令整個畫面重畫，工作紙被拆咗重砌，
   捲動位置就歸零。現在：
   ① 工作紙畫面如果完全冇變，就原封不動，唔拆唔砌；
   ② 真係要重砌（轉筆、放大縮小）嗰陣，先記低位置，砌完拉返去。 */
function wsMount(box, html){
  const w = document.getElementById('wswrap');
  const sig = html + '|zoom' + WSV.zoom;     /* 放大縮小唔喺 html 入面，要另外計 */
  if(w && box.contains(w) && sig === WS_HTML) return;   /* 冇變：唔郁 */
  box.innerHTML = html; WS_HTML = sig;
  initWSView();
}
function wsKeepPos(){
  if(!WSV) return;
  const w = document.getElementById('wswrap');
  if(w && w.dataset.ready) WS_POS = {id:WSV.id, t:w.scrollTop, l:w.scrollLeft};
}
function wsRestorePos(){
  const w = document.getElementById('wswrap'); if(!w) return;
  if(WSV && WS_POS && WS_POS.id===WSV.id){ w.scrollTop = WS_POS.t; w.scrollLeft = WS_POS.l; }
  w.dataset.ready = '1';
  wsThumbFit();
}
let WINK = null;  /* 筆跡：[stroke…]，stroke = [顏色, 粗幼, x,y, x,y…] */
let WTXT = null;  /* 打字答案：[{x,y,t,s}…] */
const WS_COLS = {ink:'#1A2733', red:'#D3453B', blue:'#2F6FB0'};

function wsInkKey(id){ return K+'.wsink.'+(ROLE==='t'?'T':ME)+'.'+id; }
function wsLoadInk(id){
  try{ const r=JSON.parse(localStorage.getItem(wsInkKey(id)));
    if(r){ WINK=Array.isArray(r.k)?r.k:[]; WTXT=Array.isArray(r.t)?r.t:[]; return; } }catch(e){}
  WINK=[]; WTXT=[];
}
function wsSaveInk(){
  if(!WSV) return;
  try{ localStorage.setItem(wsInkKey(WSV.id), JSON.stringify({k:WINK,t:WTXT})); }catch(e){}
}
function wsHasInk(id){
  try{ const r=JSON.parse(localStorage.getItem(wsInkKey(id)));
    return !!(r && ((r.k&&r.k.length) || (r.t&&r.t.length)));
  }catch(e){ return false; }
}

function wsZoom(d){ WSV.zoom=Math.min(3, Math.max(1, +(WSV.zoom+d).toFixed(1))); render(); }
function wsUndo(){ if(WINK.length){ WINK.pop(); wsSaveInk(); wsPaint(); } }
function wsClearPage(){

/* 工作紙 ＋ 右邊粗拉桿。iPad 畫面細，手指喺紙上面係寫字，
   所以要有一條夠粗、夠易㩒嘅拉桿先拉得上拉得落。 */
function wsStage(v){
  return `<div class="wsstage">
      <div class="wswrap" id="wswrap">
        <div class="wspaper" id="wspaper">
          <img id="wsimg" src="${wsImgSrc(v.id)}" alt="">
          <canvas id="wsink"></canvas>
        </div>
      </div>
      <div class="wsscroll" id="wsscroll">
        <div class="wsthumb" id="wsthumb"><span></span><span></span><span></span></div>
      </div>
    </div>`;
}
function wsImgSrc(id){ return `ws/${id}.jpg`; }

/* 圖載入之後先對齊畫布 */
function initWSView(){
  const img=document.getElementById('wsimg'), c=document.getElementById('wsink');
  if(!img||!c) return;
  /* 用百分比定闊度，唔好量容器像素 ——
     圖由網絡載入返嚟嗰刻版面未排好，量到嘅闊度會係 0，張紙就會縮成一條。 */
  const fit=()=>{
    const paper=document.getElementById('wspaper');
    if(!paper) return;
    paper.style.width = Math.round(100*(WSV?WSV.zoom:1))+'%';
    c.width=img.naturalWidth; c.height=img.naturalHeight;   /* 畫布用原圖座標 */
    c.style.width='100%'; c.style.height='auto';
    wsPaint(); wsThumbFit();
  };
  const first=()=>{ fit(); wsRestorePos(); };
  if(img.complete && img.naturalWidth) first(); else img.onload=first;
  bindWSScroll();
  if(window.__wsFit) window.removeEventListener('resize', window.__wsFit);
  window.__wsFit = fit;
  window.addEventListener('resize', fit);
  bindWSInk(c);
}
/* ── 右邊粗拉桿 ── */
function wsThumbFit(){
  const wrap=document.getElementById('wswrap'), track=document.getElementById('wsscroll'),
        th=document.getElementById('wsthumb');
  if(!wrap||!track||!th) return;
  const trackH=track.clientHeight, visible=wrap.clientHeight, total=wrap.scrollHeight;
  if(total<=visible+2){ track.style.display='none'; return; }
  track.style.display='';
  const h=Math.max(70, Math.round(trackH*visible/total));
  const maxTop=trackH-h;
  const top=Math.round(maxTop * (wrap.scrollTop/(total-visible)));
  th.style.height=h+'px';
  th.style.top=Math.max(0, Math.min(maxTop, top))+'px';
}
function bindWSScroll(){
  const wrap=document.getElementById('wswrap'), track=document.getElementById('wsscroll'),
        th=document.getElementById('wsthumb');
  if(!wrap||!track||th.dataset.bound) return;
  th.dataset.bound='1';
  wrap.addEventListener('scroll', wsThumbFit);
  let drag=false, offset=0;
  const go=(clientY)=>{
    const r=track.getBoundingClientRect(), h=th.offsetHeight;
    const maxTop=track.clientHeight-h;
    let top=clientY-r.top-offset;
    top=Math.max(0, Math.min(maxTop, top));
    const total=wrap.scrollHeight, visible=wrap.clientHeight;
    wrap.scrollTop = maxTop ? (top/maxTop)*(total-visible) : 0;
    th.style.top=top+'px';
  };
  const yOf=e=>(e.touches&&e.touches[0]?e.touches[0].clientY:e.clientY);
  const down=e=>{
    e.preventDefault();
    const y=yOf(e), r=th.getBoundingClientRect();
    offset = (y>=r.top && y<=r.bottom) ? y-r.top : th.offsetHeight/2;  /* 㩒空白位就跳過去 */
    drag=true; go(y);
  };
  const move=e=>{ if(!drag) return; e.preventDefault(); go(yOf(e)); };
  const up=()=>{ drag=false; };
  track.addEventListener('pointerdown',down);
  track.addEventListener('touchstart',down,{passive:false});
  track.addEventListener('touchmove',move,{passive:false});
  window.addEventListener('pointermove',move);
  ['pointerup','pointercancel','touchend','touchcancel'].forEach(ev=>window.addEventListener(ev,up));
  setTimeout(wsThumbFit, 60);
}
function wsPaint(){
  const c=document.getElementById('wsink'); if(!c) return;
  const x=c.getContext('2d');
  x.clearRect(0,0,c.width,c.height);
  x.lineCap='round'; x.lineJoin='round';
  WINK.forEach(s=>{
    x.strokeStyle=WS_COLS[s[0]]||'#1A2733'; x.lineWidth=s[1];
    x.beginPath(); x.moveTo(s[2],s[3]);
    for(let i=4;i<s.length;i+=2) x.lineTo(s[i],s[i+1]);
    x.stroke();
  });
  WTXT.forEach(t=>{
    x.fillStyle='#1A2733'; x.font=`700 ${t.s||34}px "PingFang HK",sans-serif`;
    x.textBaseline='top'; x.fillText(t.t, t.x, t.y);
  });
}
function bindWSInk(c){
  if(c.dataset.bound) return; c.dataset.bound='1';
  let on=false, cur=null;
  const pos=e=>{ const r=c.getBoundingClientRect(), q=e.touches?e.touches[0]:e;
    return [Math.round((q.clientX-r.left)*c.width/r.width),
            Math.round((q.clientY-r.top)*c.height/r.height)]; };
  const start=e=>{
    const [px,py]=pos(e);
    if(WSV.tool==='type'){ e.preventDefault(); wsAddText(px,py); return; }
    e.preventDefault(); on=true; DRAWING=true; DRAW_TS=Date.now();
    if(WSV.tool==='erase'){ wsErase(px,py); return; }
    const w = WSV.tool==='red' ? 6 : 4;
    cur=[WSV.tool, w, px, py];
    WINK.push(cur);
    wsPaint();
  };
  const move=e=>{
    if(!on) return; e.preventDefault(); DRAW_TS=Date.now();
    const [px,py]=pos(e);
    if(WSV.tool==='erase'){ wsErase(px,py); return; }
    const lx=cur[cur.length-2], ly=cur[cur.length-1];
    if(Math.abs(px-lx)+Math.abs(py-ly)<2) return;
    cur.push(px,py); wsPaint();
  };
  const end=()=>{ if(!on) return; on=false; cur=null; DRAWING=false; wsSaveInk(); };
  c.addEventListener('pointerdown',start); c.addEventListener('pointermove',move);
  c.addEventListener('touchstart',start,{passive:false});
  c.addEventListener('touchmove',move,{passive:false});
  ['touchend','touchcancel','pointercancel'].forEach(ev=>c.addEventListener(ev,end));
  if(window.__wsUp){ ['pointerup','pointercancel','touchcancel'].forEach(ev=>window.removeEventListener(ev,window.__wsUp)); }
  window.__wsUp=end;
  ['pointerup','pointercancel','touchcancel'].forEach(ev=>window.addEventListener(ev,end));
}
/* 擦膠：擦走碰到嘅筆劃 */
function wsErase(px,py){
  const R=18, a=WINK;
  let hit=false;
  for(let i=a.length-1;i>=0;i--){
    const s=a[i];
    for(let j=2;j<s.length;j+=2){
      if(Math.abs(s[j]-px)<R && Math.abs(s[j+1]-py)<R){ a.splice(i,1); hit=true; break; }
    }
  }
  const t=WTXT;
  for(let i=t.length-1;i>=0;i--){
    if(Math.abs(t[i].x-px)<60 && Math.abs(t[i].y-py)<40){ t.splice(i,1); hit=true; }
  }
  if(hit){ wsSaveInk(); wsPaint(); }
}
function wsAddText(px,py){
  const s=prompt('打你的答案（可用粵語拼音輸入法）：');
  if(!s || !s.trim()) return;
  WTXT.push({x:px, y:py, t:s.trim(), s:34});
  wsSaveInk(); wsPaint();
}

/* ══ 教師版：喺大電視打開工作紙，一路圈一路講 ══ */

/* 本連堂可以喺大電視打開嘅工作紙（例如同學做填充時，開返閱讀句子嗰張畀佢哋睇） */
function tWSOpenRow(set){
  const seen={}, btns=[];
  ['H','M'].forEach(tr=>((WS[set]||{})[tr]||[]).forEach(x=>{
    if(x.v || !WSIMG[x.id] || seen[x.id]) return;
    seen[x.id]=1;
    btns.push(`<button class="btn sm" onclick="wsOpen('${x.id}')">📄 ${tr==='H'?'高組':'中組'}·${x.t}</button>`);
  }));
  if(!btns.length) return '';
  return `<div class="note" style="border-left-color:#7FD3B0">
      📺 <b>在大電視打開工作紙講解</b>（可以用紅筆圈畫；同學做填充、抄寫時，開返「閱讀句子」那張給他們看）</div>

}

/* ══ 學生版：只見自己嗰疊，按次序；唔顯示任何組別字眼 ══ */
function sWS(me){
  const set = wsSet(), list = wsList(me, set);
  if(!list.length) return wait('😊','請等待老師指示','請看大電視');
  const cur = list.findIndex(x=>wsState(me.id, x.id)===0);
  const done = list.filter(x=>wsState(me.id,x.id)>0).length;
  return `<div class="stu"><div class="q">
    <div class="qt">📄 ${ruby('今日的工作紙')}　<span class="wsprog">${done}／${list.length}</span></div>
    <div class="wslist">${list.map((x,i)=>{
      const st = wsState(me.id, x.id), now = i===cur;
      const hasImg = !!WSIMG[x.id];
      return `<div class="wsitem s${st} ${now?'now':''}">
        <div class="wsno">${st===2?'⭐':st===1?'✋':i+1}</div>
        <div class="wst">${ruby(x.t)}
          ${(me.en||LANG==='en')&&wsEn(x.t)?`<div class="tr">${wsEn(x.t)}</div>`:''}
          ${now?`<div class="wshint">${ruby(hasImg?'現在做這一張':'現在做這一張（紙本）')}</div>`:''}
          ${st===1?`<div class="wshint">${ruby('等老師檢查')}</div>`:''}
          ${hasImg&&wsHasInk(x.id)?`<div class="wshint">${ruby('已經寫了一些')}</div>`:''}</div>
        ${hasImg?`<button class="btn ${now?'mint':'sm'}" onclick="wsOpen('${x.id}')">
           📄 ${ruby(st>0?'再看一次':'打開做')}</button>`:''}
        ${now&&!hasImg?`<button class="btn mint" onclick="wsDone('${x.id}')">✋ ${ruby('我做完了')}</button>`:''}
        ${st===1?`<button class="btn sm" onclick="wsDone('${x.id}')">↺ ${ruby('按錯了')}</button>`:''}
      </div>`;
    }).join('')}</div>
    ${cur<0?`<div class="hint" style="margin-top:12px">🎉 ${ruby('全部做完了！')}</div>`:''}
  </div></div>`;
}

function greeting(){

/* ================================================================
   選詞小遊戲：圖字卡選擇。干擾詞取自整個單元的課文詞語
   （可以用其他連堂的字詞）。老師可揀 12／8／4／3／2 選一；
   學生機預設：高組 6 選 1、中組 4 選 1、初組 2 選 1。
   ================================================================ */
const GAME_N = [12,8,6,4,3,2];
const GAME_DEF = {1:6, 2:4, 3:2};
function unitWords(){ return [...new Set(lessons().flatMap(l=>l.keys))]; }
function gameOpts(word, n){
  const pool = unitWords().filter(w=>w!==word && imgOf(w));
  let seed=0; for(const c of word) seed+=c.charCodeAt(0);
  const picked=[];
  for(let i=0;i<n-1 && pool.length;i++)
    picked.push(pool.splice((seed*(i+11))%pool.length,1)[0]);
  return [word,...picked].sort((a,b)=>((seed+a.charCodeAt(0))%13)-((seed+b.charCodeAt(0))%13));
}
function startGame(w){
  CTRL.game = {w, n:6, who:null};
  CTRL.showExplain=false; saveCtrl(); render();
}
function gameSet(k,v){ CTRL.game[k]=v; CTRL.game.pick=null; saveCtrl(); render(); }
/* 大電視上作答：同學出來按圖字卡，即時出對／錯效果 */
function tGameAns(choice, el){
  const g = CTRL.game, ok = choice===g.w;
  g.pick = choice;
  if(!ok && el){ el.classList.add('wrong'); setTimeout(()=>el.classList.remove('wrong'),600); }
  /* 如果老師點了某位同學出來做，成績記在該位同學名下 */
  if(g.who){
    const rec = ANS[g.who] || {a:{},prog:''};
    if((rec.ep||'') !== (CTRL.epoch||'')){ rec.a = {}; rec.ep = CTRL.epoch||''; }
    rec.a['g_'+g.w] = choice;
    wr(KA(g.who), rec); pullAns();
  }
  saveCtrl(); render();
  if(ok) cheer('答對了！'); else wrongFlash();
}
function endGame(){ CTRL.game=null; saveCtrl(); render(); }

function tGame(){
  const g = CTRL.game, opts = gameOpts(g.w, g.n);
  const answers = STUDENTS.map(s=>{
    const v = myA(s.id)['g_'+g.w];

/* 判卷：圈選比對答案文字；打字去空白後比對；手寫要老師人手判 */
function judge(q, v){
  if(v===undefined || v===null) return null;
  if(typeof v === 'object') return null;              /* 手寫，交老師判斷 */
  return String(v).replace(/\s/g,'') === String(q.ans).replace(/\s/g,'');
}

  if(v===undefined || v===null) return '未作答';

/* ---------- ⑤ 評分 ---------- */
/* ================================================================
   ⑥ 總結算 — 答對一題即 $1，不需再逐項評 0–4 分
   ================================================================ */
function scoreOf(sid){
  if(lisOn()) return lisScore(sid);
  if(isU2()) return scoreOf2(sid);
  const s=stu(sid), a=myA(sid), set=qaSet();
  let right=0, total=0, det=[];
  words().forEach((w,i)=>{
    total++;
    const v=a['p'+i];
    const ok = v!==undefined && pickOpts(w,s.lv)[v]===w;
    if(ok) right++;
    det.push({lb:`選字「${w}」`, ok, done:v!==undefined});
  });
  set.forEach((q,i)=>{
    total++;
    const v=a['q'+i]!==undefined ? a['q'+i] : a['t_q'+i];
    const ok = judge(q,v)===true;
    if(ok) right++;
    det.push({lb:`問答 ${i+1}`, ok, done:v!==undefined});
  });
  unitWords().forEach(w=>{
    const v=a['g_'+w]; if(v===undefined) return;
    total++; const ok = v===w; if(ok) right++;
    det.push({lb:`遊戲「${w}」`, ok, done:true});
  });
  /* 工作紙：老師確認一張 $1 */
  wsList(s, wsSet()).forEach(x=>{
    total++; const st = wsState(sid, x.id); if(st===2) right++;
    det.push({lb:`工作紙「${x.t}」`, ok:st===2, done:st>0});
  });
  return {right, total, det};
}
function recalcCoins(sid){
  CTRL.adj = CTRL.adj||{};
  CTRL.coins[sid] = Math.max(0, scoreOf(sid).right + (CTRL.adj[sid]||0));
}
function recalcAll(){ STUDENTS.forEach(s=>recalcCoins(s.id)); }
function addCoin(sid,d){
  CTRL.adj = CTRL.adj||{}; CTRL.adj[sid]=(CTRL.adj[sid]||0)+d;
  recalcCoins(sid); saveCtrl(); render();
}

/* ---------- 提示：句子（答案加括號）／圖字卡對比／大圖 ---------- */
function hintHTML(h, showEn, big){
  if(!h) return '';
  const sc = big ? 1.25 : 1;
  let out = '';
  if(h.sent){
    const marked = h.sent.replace(/（([^）]*)）/g,
      '<b style="color:#B7791F;background:rgba(255,233,168,.9);border-radius:8px;padding:0 6px">$1</b>');
    out += `<div style="font-size:${1.15*sc}rem;line-height:2.2;font-weight:800;margin-bottom:8px">
      ${rubyKeepTags(marked)}</div>`;
  }
  if(h.cards){
    out += `<div style="display:flex;gap:${12*sc}px;justify-content:center;flex-wrap:wrap;margin:10px 0">`
      + h.cards.map(c=>`
        <div style="text-align:center">
          ${c.img ? `<img src="${imgOf(c.img)||''}" style="width:${(c.small?90:140)*sc}px;height:${(c.small?70:104)*sc}px;
              object-fit:cover;border-radius:14px;border:4px solid #fff;box-shadow:var(--sh)">`
                  : `<div style="width:${140*sc}px;height:${104*sc}px;border-radius:14px;background:${c.swatch};
              border:4px solid #fff;box-shadow:var(--sh)"></div>`}
          <div style="font-size:${1.15*sc}rem;font-weight:900;margin-top:6px">${ruby(c.lab)}</div>
          ${showEn&&c.labe?`<div class="tr">${c.labe}</div>`:''}
        </div>`).join('') + `</div>`;
  }
  if(h.img && !h.cards){
    out += `<img src="${imgOf(h.img)||''}" style="max-width:${230*sc}px;border-radius:14px;
      border:4px solid #fff;box-shadow:var(--sh);display:block;margin:8px auto">`;
  }
  if(h.t) out += `<div style="font-size:${1.05*sc}rem;font-weight:700;margin-top:6px">${ruby(h.t)}</div>`;
  if(showEn && h.te) out += `<div class="tr">${h.te}</div>`;
  return out;
}
