/* ==================================================================
   打字保護
   同學用輸入法打字時，中文字要經「組字」階段才成形。
   如果這一刻因為雲端同步而重畫畫面，輸入框會被拆掉重建，
   正在組的字就會散掉（例如「亮」變回「卜山」）。
   所以：有輸入框在使用時，一律押後重畫，等離開輸入框才補畫。
   ================================================================== */
let TYPING = false;       /* 輸入框有焦點 */
let COMPOSING = false;    /* 輸入法正在組字 */
let RENDER_WANTED = false;
let LAST_RENDER = 0, RENDER_TIMER = null;

/* ══ 學生機「死機」防護 ══
   重畫會因為三件事被押後：學生打緊字、輸入法組緊字、手指喺度寫緊字。
   問題係「結束」嘅事件唔一定嚟到 —— iPad 上第二隻手指掂到或者掃屏，
   系統會取消觸控（冇 touchend）；輸入框亦可能連焦點一齊被刪走（冇 blur）。
   一旦收唔到結束事件，旗標就永遠停喺 true，之後每次重畫都被押後，
   部機好似死咗咁，老師轉幾多頁都唔會郁。
   所以唔再淨靠旗標，改為問「而家真係咁咩」，同埋加時限。 */
let TYPE_TS = 0, DRAW_TS = 0;
function typingNow(){
  const a = document.activeElement;
  if(!(a && a.classList && a.classList.contains('typebox'))) return false;
  return Date.now() - TYPE_TS < 8000;      /* 八秒冇撳過掣就當佢唔係打緊 */
}
function drawingNow(){
  return DRAWING && Date.now() - DRAW_TS < 2000;   /* 兩秒冇郁過就當佢放咗手 */
}
function busyNow(){ return typingNow() || drawingNow(); }

/* 看門狗：押後咗嘅重畫，一冇人打字寫字就即刻補畫，
   確保學生機唔會永久停喺舊畫面。 */
setInterval(()=>{
  if(!RENDER_WANTED || busyNow()) return;
  RENDER_WANTED = false;
  TYPING = COMPOSING = DRAWING = false;
  const el = document.activeElement;
  if(el && el.classList && el.classList.contains('typebox') && el.dataset.key)
    typeSave(el.dataset.key, el.value);          /* 打咗嘅字唔好唔見咗 */
  try{ render(); }catch(e){}
}, 1200);

function renderSafe(){
  if(busyNow()){ RENDER_WANTED = true; return; }
  /* 同步密集時唔好一有變動就重建整版畫面；最多每 400 毫秒畫一次 */
  const gap = Date.now() - LAST_RENDER;
  if(gap >= 400){ LAST_RENDER = Date.now(); render(); return; }
  if(RENDER_TIMER) return;
  RENDER_TIMER = setTimeout(()=>{
    RENDER_TIMER = null; LAST_RENDER = Date.now();
    if(!busyNow()) render(); else RENDER_WANTED = true;
  }, 400 - gap);
}
function flushRender(){
  if(RENDER_WANTED){ RENDER_WANTED = false; render(); }
}
/* 每次畫完學生版，把事件掛回輸入框（不用 inline oninput，才管得住組字） */
function bindTypeBoxes(){
  document.querySelectorAll('.typebox').forEach(el=>{
    if(el.dataset.bound) return; el.dataset.bound = '1';
    const key = el.dataset.key;
    el.addEventListener('focus', ()=>{ TYPING = true; TYPE_TS = Date.now(); });
    el.addEventListener('keydown', ()=>{ TYPE_TS = Date.now(); });
    el.addEventListener('compositionupdate', ()=>{ TYPE_TS = Date.now(); });
    el.addEventListener('blur',  ()=>{ TYPING = false; typeSave(key, el.value); flushRender(); });
    el.addEventListener('compositionstart', ()=>{ COMPOSING = true; });
    el.addEventListener('compositionend', e=>{
      COMPOSING = false; typeSave(key, e.target.value);
    });
    el.addEventListener('input', e=>{
      TYPE_TS = Date.now();
      if(COMPOSING) return;          /* 組字途中不儲存，避免存了半截 */
      typeSave(key, e.target.value);
    });
  });
}
/* ================================================================
   書寫／打字二選一元件（全程式統一）
   兩種方式同時顯示；學生一旦用了其中一種，另一種即變灰不可用，
   直到按「重新選擇」為止。
   key = 答案的儲存鍵；手寫存 key，打字存 't_'+key
   ================================================================ */
function inputBlock(key, target, wlv, padId, opt){
  opt = opt||{};
  const a = myAns();
  const hasPad  = a[key]!==undefined;
  const hasType = a['t_'+key]!==undefined && String(a['t_'+key]).trim()!=='';
  const w = Math.max(760, target.length*250);
  return `
  <div class="dual">
    <div class="way ${hasType?'off':''}">
      <div class="waylb">✍️ ${ruby('用手寫')}${hasType?`<span class="lock">已選用打字</span>`:''}</div>
      <canvas class="pad" id="${padId}" data-key="${key}" data-txt="${target}"
        width="${w}" height="280"></canvas>
      <div class="padbar">
        <button class="btn" ${hasType?'disabled':''} onclick="${opt.clear||`clearPad()`}">🧹 ${T('擦掉重寫')}</button>
        <button class="btn mint" ${hasType?'disabled':''} onclick="${opt.save||`savePad()`}">
          ✔ ${T(hasPad?'已提交，可再書寫':'寫好了')}</button>
      </div>
    </div>
    <div class="way ${hasPad?'off':''}">
      <div class="waylb">⌨️ ${ruby('用鍵盤打字')}${hasPad?`<span class="lock">已選用手寫</span>`:''}</div>
      <input class="typebox" id="ti_${key}" data-key="${key}" ${hasPad?'disabled':''}
        value="${String(a['t_'+key]||'').replace(/"/g,'&quot;')}"
        placeholder="可用粵語拼音輸入法">
    </div>
  </div>
  ${(hasPad||hasType)?`<div class="row" style="justify-content:center;margin-top:8px">
    <button class="btn sm" onclick="resetInput('${key}')">↺ ${ruby('重新選擇')}</button></div>`:''}`;
}
function typeSave(key, v){
  const a = myAns();
  if(String(v).trim()) a['t_'+key] = v; else delete a['t_'+key];
  saveMine();
  paintDual();                    /* 只改灰階，不重畫整頁，游標不會走位 */
}
function resetInput(key){
  const a = myAns(); delete a[key]; delete a['t_'+key];
  saveMine(); render();
}
/* 不重繪整頁，只更新兩邊的可用狀態 */
function paintDual(){
  document.querySelectorAll('.dual').forEach(d=>{
    const inp = d.querySelector('.typebox'); if(!inp) return;
    const key = inp.id.slice(3);
    const a = myAns();
    const hasPad  = a[key]!==undefined;
    const hasType = a['t_'+key]!==undefined && String(a['t_'+key]).trim()!=='';
    const ways = d.querySelectorAll('.way');
    ways[0].classList.toggle('off', hasType);
    ways[1].classList.toggle('off', hasPad);
    ways[0].querySelectorAll('button').forEach(b=>b.disabled = hasType);
    inp.disabled = hasPad;
  });
}
/* ---------- 課堂筆記的三個手寫格 ---------- */
const NPADS = {};

/* ---------- 手寫板 ----------
   書寫以「筆劃座標」儲存，不用 PNG：體積小約十倍，
   可放進 Google 試算表的儲存格，列印時亦是向量，不會鋸齒。 */
const SW = 8;   /* 筆畫粗細 */
function strokesSVG(rec, h){
  if(!rec || !rec.s || !rec.s.length) return '';
  const d = rec.s.map(st=>{
    let p=''; for(let i=0;i<st.length;i+=2) p += (i?'L':'M')+st[i]+' '+st[i+1];
    return p;
  }).join(' ');
  return `<svg viewBox="0 0 ${rec.w} ${rec.h}" preserveAspectRatio="xMidYMid meet"
    style="width:100%;${h?`max-height:${h}px;`:''}background:#fff;border-radius:10px;display:block">
    <path d="${d}" fill="none" stroke="#2E3440" stroke-width="${SW}"
      stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
let PAD=null;
/* 學生寫咗但未撳「寫好了」嘅筆劃。
   畫面每次重畫（老師轉頁、其他同學交嘢）都會造一個新手寫板；
   如果只由「已儲存」嘅內容開始，學生啱啱寫嗰幾筆就會不見了 ——
   十二個人一齊上堂時同步好密，所以寫寫下就會消失。
   未提交嘅筆劃留喺呢度，重畫幾多次都攞得返。
   只存喺本機記憶，唔會上雲端；換連堂或重新載入就清走。 */
const PADBUF = {};
let DRAWING = false;

/* 共用手寫板：課堂筆記與抄寫詞語都用這個 */
function makePad(c, target, wlv, saved, key){
  const x = c.getContext('2d');
  const bg = ()=>{
    x.clearRect(0,0,c.width,c.height);
    x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height);
    const n=target.length, w=c.width/n;
    x.strokeStyle='#E3E9F2'; x.lineWidth=2;
    for(let k=0;k<n;k++){
      x.strokeRect(k*w+4,4,w-8,c.height-8);
      x.beginPath(); x.setLineDash([8,8]);
      x.moveTo(k*w+w/2,4); x.lineTo(k*w+w/2,c.height-4);
      x.moveTo(k*w+4,c.height/2); x.lineTo(k*w+w-4,c.height/2);
      x.stroke(); x.setLineDash([]);
    }
    if(wlv>0){
      x.fillStyle = wlv===1?'rgba(60,80,110,.15)':'rgba(60,80,110,.30)';
      x.font=`${Math.min(w,c.height)*.76}px "PingFang HK",sans-serif`;
      x.textAlign='center'; x.textBaseline='middle';
      [...target].forEach((ch,k)=>x.fillText(ch,k*w+w/2,c.height/2));
    }
    /* 每格底部標粵拼 —— 同學一路照住寫一路要讀得出，
       顏色用返畫面其他地方注音同一隻藍。 */
    if(!document.body.classList.contains('nojy')){
      x.fillStyle = '#4C7FA8';                 /* 同畫面其他注音同一隻藍 */
      x.font = `700 ${Math.max(14, Math.min(w, c.height)*0.15)}px "PingFang HK",sans-serif`;
      x.textAlign='center'; x.textBaseline='alphabetic';
      [...target].forEach((ch,k)=>{
        if(JYUT[ch]) x.fillText(JYUT[ch], k*w+w/2, c.height-10);
      });
    }
  };
  const seed = (key && PADBUF[key]) || (saved && saved.s) || [];
  const P = {c, x, key:c.dataset.key, bufKey:key, strokes: seed.map(a=>[...a])};
  P.repaint = ()=>{
    bg();
    x.strokeStyle='#2E3440'; x.lineWidth=SW; x.lineCap='round'; x.lineJoin='round';
    for(const st of P.strokes){
      x.beginPath(); x.moveTo(st[0],st[1]);
      for(let i=2;i<st.length;i+=2) x.lineTo(st[i],st[i+1]);
      x.stroke();
    }
  };
  P.repaint();
  let on=false, cur=null;
  const pos=e=>{ const r=c.getBoundingClientRect(), q=e.touches?e.touches[0]:e;
    return [Math.round((q.clientX-r.left)*c.width/r.width),
            Math.round((q.clientY-r.top)*c.height/r.height)]; };
  const start=e=>{ e.preventDefault(); on=true; DRAWING=true; DRAW_TS=Date.now();
    const [px,py]=pos(e); cur=[px,py]; P.strokes.push(cur);
    x.strokeStyle='#2E3440'; x.lineWidth=SW; x.lineCap='round'; x.lineJoin='round';
    x.beginPath(); x.moveTo(px,py); };
  const move=e=>{ if(!on) return; e.preventDefault(); DRAW_TS=Date.now();
    const [px,py]=pos(e), lx=cur[cur.length-2], ly=cur[cur.length-1];
    if(Math.abs(px-lx)+Math.abs(py-ly) < 3) return;
    cur.push(px,py); x.lineTo(px,py); x.stroke(); };
  const end=()=>{
    on=false; cur=null; DRAWING=false;
    if(key) PADBUF[key] = P.strokes;    /* 每寫完一筆即刻記低 */
  };
  c.addEventListener('pointerdown',start); c.addEventListener('pointermove',move);
  c.addEventListener('touchstart',start,{passive:false});
  c.addEventListener('touchmove',move,{passive:false});
  c.addEventListener('touchend',end);
  /* 觸控被系統取消（第二隻手指掂到、掃屏手勢）唔會有 touchend，
     一定要當佢收咗筆，否則之後成部機都唔會再重畫。 */
  c.addEventListener('touchcancel',end);
  c.addEventListener('pointercancel',end);
  /* 放手事件要掛喺 window（手指可能移出格外先放手），
     但畫面每次重畫都會再造一次手寫板 —— 舊嗰個監聽器一定要移除，
     否則會越積越多，用得耐就會越嚟越窒。 */
  if(window.__padUp){
    window.removeEventListener('pointerup', window.__padUp);
    window.removeEventListener('pointercancel', window.__padUp);
    window.removeEventListener('touchcancel', window.__padUp);
  }
  window.__padUp = end;
  window.addEventListener('pointerup', end);
  window.addEventListener('pointercancel', end);
  window.addEventListener('touchcancel', end);
  return P;
}
function initPad(me){
  const c=document.getElementById('pad'); if(!c) return;
  const k = 'w'+CTRL.wordIdx;
  PAD = makePad(c, curWord(), me.wlv, myAns()[k], k);
}
/* 突然鎖機／轉頁時，把未按「寫好了」嘅筆劃悄悄儲起，避免同學白寫 */
function stashPad(){
  if(!ME || !PAD || !PAD.strokes || !PAD.strokes.length) return;
  const key = (CTRL.phase==='qa') ? ('q'+CTRL.qIdx) : ('w'+CTRL.wordIdx);
  const cur = myAns()[key];
  const now = JSON.stringify(PAD.strokes);
  if(cur && cur.s && JSON.stringify(cur.s)===now) return;   /* 同已儲存嘅一樣就唔使再存 */
  myAns()[key] = {s:PAD.strokes, w:PAD.c.width, h:PAD.c.height};
  PAD = null;
  saveMine();
}
function clearPad(){
  if(!PAD) return;
  PAD.strokes=[]; if(PAD.bufKey) delete PADBUF[PAD.bufKey];
  PAD.repaint();
}
function savePad(){
  if(!PAD || !PAD.strokes.length){ alert('請先書寫，然後才按「寫好了」。'); return; }
  const k = 'w'+CTRL.wordIdx;
  myAns()[k] = {s:PAD.strokes, w:PAD.c.width, h:PAD.c.height};
  delete PADBUF[k];
  ANS[ME].prog='done'; saveMine(); render(); cheer('書寫完成！');
}

/* 一個字一個格：格數與要寫的字數完全一致。
   灰階版在格內印淺色字讓學生描；高組版留空。
   數字與括號用窄格，避免日期一行放不下。 */
function printCells(txt, grey){
  return `<div class="cells">` + [...txt].map(ch=>{
    const narrow = /[0-9０-９（）()]/.test(ch) ? ' narrow' : '';
    return `<div class="cell${narrow}${grey?' grey':''}">${grey?ch:''}</div>`;
  }).join('') + `</div>`;
}
function printQ(q, i, lv, grey){
  const mode = qMode(lv);
  let bd;
  if(mode==='write'){
    /* 高組：寫出答案 */
    bd = `<div class="ansline"><span class="alab">答：</span>${printCells(q.ans, false)}</div>`;
  } else {
    const opts = qOpts(q, lv);
    bd = `<div class="opts">${opts.map(o=>`<span class="opt">（　）${o}</span>`).join('')}</div>`;
    if(grey) bd += `<div class="ansline"><span class="alab">答：</span>${printCells(q.ans, true)}</div>`;
  }
  let hint='';
  const h=q.hint;
  if(h){
    let inner='';
    if(h.sent) inner += `<div class="hsent">${h.sent}</div>`;
    if(h.cards) inner += `<div class="hcards">${h.cards.map(c=>`
      <div class="hcard">${c.img?`<img src="${IMG[c.img]||''}">`
        :`<div class="sw" style="background:${c.swatch}"></div>`}
        <div class="hlab">${c.lab}</div></div>`).join('')}</div>`;
    if(h.img && !h.cards) inner += `<img class="pic sm" src="${IMG[h.img]||''}">`;
    if(h.t) inner += `<div class="htext">${h.t}</div>`;
    if(inner) hint = `<div class="hint"><span class="htag">提示</span>${inner}</div>`;
  }
  return `<div class="q"><div class="qn">${i+1}.　${q.q}</div>${bd}${hint}</div>`;
}

/* ================================================================
   🎧 聆聽專題：程式（第二版）
   老師：一個大掣依次「播放指示 → 請同學作答 → 公佈答案 → 下一題」
   學生：聽完才作答；高／中／初組按各自能力調整選項數目和指示長短
   每節分「60 分鐘核心版」和「90 分鐘加長版」（題目的 x:1 = 加長版才有）
   答案存在各人的 ANS（key = L<節>_<項>），答對一題 $1，沿用「總結算」
   ================================================================ */
const LIS_NOPT  = {1:4, 2:3, 3:2};   /* 選擇題：高組 4 選 1、中組 3 選 1、初組 2 選 1 */
const LIS_NSTEP = {1:3, 2:2, 3:1};   /* 排次序／多選：高組三項、中組兩項、初組一項 */
const LIS_MIN   = {teach:2, choice:2, order:3, boss:1.2, multi:2.5, act:5};   /* 每類題目預計分鐘 */
const LIS_FIXED = 18;   /* 打招呼、課堂筆記、總結算、課堂總結及轉頁，合共約 18 分鐘 */
const LIS_STEPS = [['hello','① 打招呼'],['notes','② 課堂筆記'],['lis','③ 聽力闖關'],
                   ['review','④ 總結算'],['goals','⑤ 課堂總結']];
/* 粵拼表是逐字查的，遇到讀音會變的詞語在此指定（愈長的詞愈優先） */
const LIS_FIX = {};
let LIS_FIXRE = null;
function lisFixInit(){
  const ks = Object.keys(LIS_FIX).sort((a,b)=>b.length-a.length);
  LIS_FIXRE = ks.length ? new RegExp('('+ks.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')') : null;
}
let LIS_TIPS = false, LIS_THEORY = false, LIS_SEEN = '', LIS_PLAYING = false, LIS_NOISE = null;
let LIS_TM = null, LIS_AC = null, LIS_BEEPS = [];
const LIS_TTS = {tok:0, timer:null};

function lr(s){
  s = String(s==null?'':s);
  if(!LIS_FIXRE) return ruby(s);
  return s.split(LIS_FIXRE).map(p=> LIS_FIX[p]
    ? [...p].map((c,j)=> (LIS_FIX[p][j] || JYUT[c]) ? `<ruby>${c}<rt>${LIS_FIX[p][j] || JYUT[c]}</rt></ruby>` : c).join('')
    : ruby(p)).join('');
}
function lisCap(s){ return lr(String(s||'').replace(/｜/g,'　')); }
function lisOn(){ return CTRL.mode==='lis'; }
function lisS(){
  if(!CTRL.lis) CTRL.lis = {s:1, i:0, st:'listen', tx:true, sp:false, pick:null, plays:0, run:'0', len:'60', t0:0};
  return CTRL.lis;
}
function lisSess(){ return LIS[(lisS().s||1)-1] || LIS[0]; }
function lisItem(){ const S=lisSess(); return S.items[Math.min(Math.max(0,lisS().i), S.items.length-1)]; }
function lisKey(s,i){ return 'L'+s+'_'+i; }
function lisPage(it){ return it.k==='teach' || it.k==='act'; }
function lisScored(it){ return !lisPage(it); }
function lisLen(){ return lisS().len==='90' ? '90' : '60'; }
function lisShown(it, len){ return len==='90' || !it.x; }
function lisMin(it){ return it.min || (it.same ? 1 : (it.beep ? 1.5 : (LIS_MIN[it.k]||2))); }
function lisVis(S, len){ const r=[]; S.items.forEach((it,i)=>{ if(lisShown(it,len)) r.push(i); }); return r; }
function lisSumMin(S, len, from){
  let m = 0; S.items.forEach((it,i)=>{ if(i>=(from||0) && lisShown(it,len)) m += lisMin(it); });
  return Math.round(m);
}
function lisNextIdx(i){ const S=lisSess(), len=lisLen(); for(let k=i+1;k<S.items.length;k++) if(lisShown(S.items[k],len)) return k; return S.items.length; }
function lisPrevIdx(i){ const S=lisSess(), len=lisLen(); for(let k=i-1;k>=0;k--) if(lisShown(S.items[k],len)) return k; return -1; }
/* 每次「開始一節」都有一個新的場次編號；學生答案連同編號一起存，
   舊場次的答案自動當作沒有，不用逐部平板清除 */
function lisGet(sid, i){
  const L = lisS(), a = myA(sid);
  if(a['L'+L.s+'r'] !== L.run) return undefined;
  return a[lisKey(L.s,i)];
}
function lisPut(i, v){
  const L = lisS(), a = myAns(), stamp = 'L'+L.s+'r';
  if(a[stamp] !== L.run){
    Object.keys(a).forEach(k=>{ if(k.indexOf('L'+L.s+'_')===0) delete a[k]; });
    a[stamp] = L.run;
  }
  if(v===undefined || v===null || (Array.isArray(v) && !v.length)) delete a[lisKey(L.s,i)];
  else a[lisKey(L.s,i)] = v;
  saveMine();
}
function stepsNow(){ return lisOn() ? LIS_STEPS : (isU2() ? STEPS2 : STEPS); }
function unitName(){ return lisOn() ? lisSess().unit : unitInfo(curUnit()).name; }
function lisFresh(it){ return (lisPage(it) || it.same || (!it.say && !it.beep)) ? 'answer' : 'listen'; }

/* ── 聲音：語音（「｜」處停一停）、嗶聲、倒數鈴聲 ── */
function lisStop(){
  LIS_TTS.tok++; clearTimeout(LIS_TTS.timer);
  try{ speechSynthesis.cancel(); }catch(e){}
  LIS_BEEPS.forEach(o=>{ try{ o.stop(); }catch(e){} }); LIS_BEEPS = [];
}
function lisAC(){
  try{
    if(!LIS_AC){ const C = window.AudioContext || window.webkitAudioContext; LIS_AC = new C(); }
    if(LIS_AC.state==='suspended') LIS_AC.resume();
  }catch(e){ LIS_AC = null; }
  return LIS_AC;
}
/* 嗶聲序列：數字＝頻率（Hz，約 0.3 秒）；{f:頻率, d:秒} 可指定長短 */
function lisBeepPlay(seq, cont, tok){
  const ac = lisAC();
  if(!ac){ setTimeout(()=>{ if(tok===LIS_TTS.tok) cont(); }, 400); return; }
  let t = ac.currentTime + 0.05;
  seq.forEach(b=>{
    const f = typeof b==='number' ? b : b.f, d = typeof b==='number' ? 0.3 : (b.d||0.3);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t+0.02);
    g.gain.setValueAtTime(0.35, t+d-0.04); g.gain.exponentialRampToValueAtTime(0.0001, t+d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+0.02);
    LIS_BEEPS.push(o); t += d + 0.25;
  });
  clearTimeout(LIS_TTS.timer);
  LIS_TTS.timer = setTimeout(()=>{ if(tok===LIS_TTS.tok) cont(); }, (t-ac.currentTime)*1000 + 150);
}
function lisSpeakRaw(text, cont, tok, o){
  const parts = String(text||'').split('｜').map(x=>x.trim()).filter(Boolean);
  if(!parts.length || typeof speechSynthesis==='undefined'){ cont(); return; }
  const gap = (o && o.gap!=null) ? o.gap : 700;
  let k = 0;
  const next = ()=>{
    if(tok!==LIS_TTS.tok) return;
    if(k>=parts.length) return cont();
    const txt = parts[k++], last = k>=parts.length;
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = 'zh-HK'; u.rate = (o && o.rate) || .78; if(VOICE) u.voice = VOICE;
    let moved = false, fb = null;
    const go = ()=>{
      if(moved || tok!==LIS_TTS.tok) return; moved = true; clearTimeout(fb);
      clearTimeout(LIS_TTS.timer); LIS_TTS.timer = setTimeout(next, last ? 150 : gap);
    };
    u.onend = go; u.onerror = go;
    /* 保險：個別語音若沒有回應（沒有粵語語音檔等），按字數估時後照樣繼續 */
    fb = setTimeout(go, txt.length*600 + 4000);
    try{ speechSynthesis.speak(u); }catch(e){ go(); }
  };
  next();
}
/* 依次播放：[{say:'…', rate}, {beep:[440,440]}] */
function lisRun(segs, done){
  lisStop(); try{ stopRead(true); }catch(e){}
  const tok = LIS_TTS.tok; let k = 0;
  const step = ()=>{
    if(tok!==LIS_TTS.tok) return;
    if(k>=segs.length){ LIS_TTS.tok++; if(done) done(); return; }
    const s = segs[k++];
    const cont = ()=>{ if(tok!==LIS_TTS.tok) return; clearTimeout(LIS_TTS.timer); LIS_TTS.timer = setTimeout(step, 300); };
    if(s.beep) lisBeepPlay(s.beep, cont, tok); else lisSpeakRaw(s.say, cont, tok, s);
  };
  step();
}
function lisSpeak(text, done, o){ lisRun([Object.assign({say:text}, o||{})], done); }

/* ── 老師：選節、翻頁、播放 ── */
function pickLis(s, again){
  lisStop(); LIS_PLAYING=false; LIS_TM=null;
  const S = LIS[s-1] || LIS[0];
  if(lisOn() && lisS().s===S.s && !again){ saveCtrl(); render(); return; }   /* 同一節：不重新開始 */
  lisClearPaid();
  CTRL.goalDone = {};
  const keepLen = (CTRL.lis && CTRL.lis.len) || '60';
  CTRL.mode = 'lis';
  CTRL.lis = {s:S.s, i:0, st:lisFresh(S.items[0]), tx:!!S.tx, sp:false, pick:null, plays:0,
              run:Date.now().toString(36), len:keepLen, t0:Date.now()};
  CTRL.lessonDate = todayStr();
  STEP = 'hello'; CTRL.phase = 'hello';
  saveCtrl(); render();
}
/* 上一節已入帳：新的一節由 $0 開始（未入帳的就保留，免得白做） */
function lisClearPaid(){
  if((CTRL.paid||{})[payKey()]){ CTRL.adj = {}; CTRL.coins = {}; }
}
function lisRestart(){
  if(!confirm('由頭開始這一節？\n（同學這一節的答案會當作清空，重新作答。）')) return;
  pickLis(lisS().s, true);
}
function lisSetLen(v){ const L = lisS(); L.len = (v==='90' ? '90' : '60'); saveCtrl(); render(); }
function lisClockReset(){ lisS().t0 = Date.now(); saveCtrl(); render(); }
function lisGo(i){
  const L = lisS(), S = lisSess();
  lisStop(); LIS_PLAYING = false; LIS_TM = null;
  if(i >= S.items.length){ tStep('review'); return; }
  i = Math.max(0, i); L.i = i;

/* 背景聲（可選）：低音量的環境噪音，用來模擬職場。只在老師這部電腦播放 */
function lisNoise(){
  if(LIS_NOISE){
    try{ LIS_NOISE.src.stop(); LIS_NOISE.ctx.close(); }catch(e){}
    LIS_NOISE = null; render(); return;
  }
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx(), len = ctx.sampleRate*4;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    let last = 0, peak = 0;
    for(let i=0;i<len;i++){ last = (last + 0.02*(Math.random()*2-1)) / 1.02; d[i] = last; peak = Math.max(peak, Math.abs(last)); }
    for(let i=0;i<len;i++) d[i] = d[i]/peak*0.5;           /* 正規化，音量在下面的增益控制 */
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    const g = ctx.createGain(); g.gain.value = 0.10;        /* 很輕 */
    src.connect(g); g.connect(ctx.destination); src.start();
    LIS_NOISE = {ctx, src};
  }catch(e){ alert('這部電腦不能播放背景聲。'); }
  render();
}

/* ── 判斷與計分 ── */
function lisNSteps(it, lv){ return Math.min(it.steps.length, LIS_NSTEP[lv]||2); }
function lisNeed(it, lv){ return Math.min(it.a.length, LIS_NSTEP[lv]||2); }
function lisMultiWant(it, lv){ return it.a.slice(0, lisNeed(it,lv)).map(j=>it.opts[j].t); }
function lisMultiShown(it, lv){          /* 學生看到的選項：要選的 ＋ 部分干擾項 */
  const need = lisNeed(it, lv), want = it.a.slice(0, need);
  const dec = it.opts.map((o,j)=>j).filter(j=>!it.a.includes(j));
  const kd = lv===1 ? dec.length : lv===2 ? Math.min(2,dec.length) : Math.min(1,dec.length);
  return want.concat(dec.slice(0,kd)).sort((x,y)=>x-y);
}
function lisOptsFor(it, lv){            /* 選擇題：保留次序，一定包括正確答案 */
  const n = LIS_NOPT[lv]||3;
  if(it.opts.length <= n) return it.opts.map((o,j)=>({o,j}));
  const keep = new Set([it.a]);
  for(let j=0;j<it.opts.length && keep.size<n;j++) keep.add(j);
  return it.opts.map((o,j)=>({o,j})).filter(x=>keep.has(x.j));
}
function lisCards(it){ return it.steps.concat(it.decoys||[]); }
function lisShuffle(arr, seed){
  const a = arr.slice(); let x = (seed*9301 + 49297) % 233280;
  for(let i=a.length-1;i>0;i--){ x = (x*9301 + 49297) % 233280; const j = x % (i+1); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}
function lisPool(it, lv, base){         /* 排次序的圖卡池：要用的步驟 ＋ 一張干擾圖卡，次序打亂 */
  const n = lisNSteps(it, lv);
  const cards = it.steps.slice(0,n).concat((it.decoys||[]).slice(0,1));
  let a = lisShuffle(cards, base + it.i*7 + n);
  if(cards.length>1 && a.every((c,j)=>c===cards[j])) a = a.slice(1).concat(a[0]);   /* 不要剛好是答案次序 */
  return a;
}
function lisJudge(it, v, lv){
  if(v===undefined || v===null) return null;
  if(it.k==='order'){
    if(!Array.isArray(v)) return null;
    const n = lisNSteps(it, lv), want = it.steps.slice(0,n).map(x=>x.t);
    if(v.length < n) return null;
    return v.length===n && v.every((x,j)=>x===want[j]);
  }
  if(it.k==='multi'){
    if(!Array.isArray(v)) return null;
    const want = lisMultiWant(it, lv);
    if(v.length < want.length) return null;
    return v.length===want.length && want.every(t=>v.includes(t));
  }
  return v === it.opts[it.a].t;
}
function lisDone(it, v, lv){ return lisJudge(it, v, lv)!==null; }
function lisShowAns(it, v){ return Array.isArray(v) ? v.join(it.k==='multi' ? '、' : '→') : String(v); }
function lisScore(sid){
  const s = stu(sid), S = lisSess(), len = lisLen();
  let right = 0, total = 0; const det = [];
  S.items.forEach((it,i)=>{
    if(!lisScored(it)) return;
    const v = lisGet(sid, i);
    if(!lisShown(it,len) && v===undefined) return;       /* 60 分鐘版沒有播的加長題不計 */
    total++;
    const ok = lisJudge(it, v, s.lv)===true;
    if(ok) right++;
    det.push({lb:`聽力第 ${i+1} 項`, ok, done:v!==undefined});
  });
  return {right, total, det};
}
function lisCounts(it){                  /* 各選項有幾多人揀 */
  const i = lisItem().i, c = {};

    if(v===undefined) return;

}

function lisQuestionTV(it, L){
  const rev = L.st==='reveal';
  const cap = (L.tx && it.say) ? `<div class="liscap">${lisCap(it.say)}</div>` : '';
  const scene = it.scene ? `<div class="lishero sm">${it.scene}</div>` : '';

  }
  const defAsk = it.k==='order' ? (it.steps.length===2 ? '先做甚麼？然後做甚麼？' : '先做甚麼？然後？最後？') : '';
  const head = `<div class="lisask">${lisTagHTML(it.tag)}${lr(it.ask || defAsk)}</div>`;
  if(it.k==='order'){
    const total = it.steps.length;
    const w = total===2 ? ['先','然後'] : ['先','然後','最後'];
    const slots = it.steps.map((x,j)=> rev
      ? `<div class="lisslot full"><div class="no">${w[j]}</div><div class="e">${x.e}</div><div class="t">${lr(x.t)}</div></div>`
      : `<div class="lisslot"><div class="no">${w[j]}</div><div class="e">？</div></div>`).join('<div class="arrow">➜</div>');
    const cards = lisShuffle(lisCards(it), it.i*7+3).map((c)=>{
      const isDecoy = !it.steps.includes(c);
      return `<button class="lisstepcard ${rev&&isDecoy?'decoy':''}" onclick="lisSayStep('${c.t}')">
        <div class="e">${c.e}</div><div class="t">${lr(c.t)}</div>${rev&&isDecoy?'<div class="x">沒有說到</div>':''}</button>`;
    }).join('');
    return `<div class="lisbox">${scene}${cap}${head}
      <div class="lisslots">${slots}</div>
      ${rev?`<div class="lisfb">${lr(lisOrderFb(it))}</div>`:''}
      <div class="liscardsrow">${cards}</div></div>`;
  }
  const counts = lisCounts(it), big = it.k==='boss', multi = it.k==='multi';
  const isRight = j => multi ? it.a.includes(j) : j===it.a;
  const opts = it.opts.map((o,j)=>{

    return lisOptHTML(o, right?'right':dim?'dim':'', `lisSayOpt(${j})`, big, extra, false);

  return `<div class="lisbox ${it.k==='boss'?'boss':''}">

function lisOrderStudent(it, L, me, showEn){

    const c = cur[j] ? find(cur[j]) : null;
    if(rev){
      const ok = cur[j]===want[j].t;
      return `<div class="lisslot ${c?(ok?'ok':'bad'):''}"><div class="no">${w[j]}</div>
        ${c?`<div class="e">${c.e}</div><div class="t">${lr(c.t)}</div>`:'<div class="e">？</div>'}</div>`;
    }
    return c ? `<button class="lisslot full" onclick="lisDelCard(${L.i},${j})"><div class="no">${w[j]}</div>
        <div class="e">${c.e}</div><div class="t">${lr(c.t)}</div></button>`
             : `<div class="lisslot"><div class="no">${w[j]}</div><div class="e">？</div></div>`;
  }).join('<div class="arrow">➜</div>');
  const pool = lisPool(it, me.lv, 11).map(c=>{
    const k = lisCards(it).indexOf(c), used = cur.includes(c.t);
    const isRight = rev && want.includes(c);
    return `<button class="lisstepcard ${used?'used':''} ${rev&&isRight?'right':''}" ${rev||used?'disabled':''} onclick="lisAddCard(${L.i},${k})">
      <div class="e">${c.e}</div><div class="t">${lr(c.t)}${lisEn(c.t, showEn)}</div></button>`;
  }).join('');
  const ask = n===1 ? '先做甚麼？' : `按次序點出前 ${n} 件事`;
  return `<div class="lisbox">
    ${it.scene?`<div class="lishero sm">${it.scene}</div>`:''}
    ${L.tx&&it.say?`<div class="liscap">${lisCap(it.say)}</div>`:''}
    <div class="lisask">${lr(ask)}${lisEn(ask, showEn)}</div>
    ${L.sp&&!rev?`<div class="row" style="justify-content:center"><button class="btn mint" onclick="lisSelfPlay()">🔊 ${T('再聽一次')}</button></div>`:''}
    <div class="lisslots">${slots}</div>
    <div class="liscardsrow">${pool}</div>
    ${rev?`<div class="lisfb">${lr(lisOrderFb(it))}</div>`:`<div class="lishint">${
      cur.length>=n ? lr('已排好，等老師公佈') : lr('聽完，才點圖卡')}</div>`}
  </div>`;
}

   對應教學計劃「聆聽」範疇：理解語意（時人地事、重點、指示）及聆聽態度。
     第 1 節 專心聽五步曲（聆聽態度）
     第 2 節 耳朵熱身：聽聲音、數字和時間
     第 3 節 聽出重點：時人地事

     第 9 節 新員工挑戰日（綜合）

   寫題目用的簡寫：
     OPS('🧼洗手|*🥛拿杯子|🚪開門')   選項；開頭加 * = 正確答案；@成仔 = 人物圖
     TCH 講解頁　ACT 課堂活動　CHQ 選擇題　FUP 同一段話的追問
     MUL 多選題　ORD 排次序　BOS 經理話　X([…]) = 只在 90 分鐘版出現
   每項（item）欄位：
     k   teach 講解／act 課堂活動／choice 選擇／multi 多選／order 排次序／boss 經理話
     say 聽到的內容（「｜」表示停一停）；beep 嗶聲（數字＝頻率）；ask 問題
     x   1 = 只在 90 分鐘版出現；min = 預計分鐘；tx = 該項是否顯示字幕
     tip 給老師看的教學技巧（學生看不到）
   ================================================================ */
const LIS_FIVE = [{e:'✋',t:'停',d:'停一停'},{e:'👀',t:'望',d:'望一望'},{e:'👂',t:'聽',d:'聽清楚'},
                  {e:'🗣️',t:'說',d:'說一說'},{e:'💪',t:'做',d:'就去做'}];
const LIS_TAGC = {'時':'a','人':'b','地':'c','事':'d','物':'e','量':'f'};
const LP   = n => ({t:n, img:n, e:{'成仔':'🧒','小愉':'👧','健仔':'👦'}[n]||'🙂'});
const MGR  = {t:'經理', e:'🧑‍💼'};
const GOOD = {e:'👍',t:'好'}, BAD = {e:'👎',t:'不好'};
const DO   = {e:'👍',t:'做'}, NODO = {e:'✋',t:'不做'};

const LIS = [];
const LIS_CJK = /[\u3400-\u9fff\uff00-\uffef]/;
/* 選項簡寫 → {opts, a:[正確位置…]} */
function OPS(str){
  const opts = [], a = [];
  String(str).split('|').forEach((p,j)=>{
    if(p[0]==='*'){ a.push(j); p = p.slice(1); }
    if(p[0]==='@'){
      const n = p.slice(1); opts.push(n==='經理' ? MGR : LP(n)); return;
    }
    const k = p.search(LIS_CJK);
    if(k<0){ opts.push({e:'', t:p}); return; }
    opts.push({e:p.slice(0,k), t:p.slice(k)});
  });
  return {opts, a};
}
function lisSteps(str){ return String(str).split('|').map(p=>{ const k = p.search(LIS_CJK); return {e:p.slice(0,k), t:p.slice(k)}; }); }
const TCH = (st,e,t,line,say,tip,o)=>Object.assign({st,k:'teach',e,t,line,say,tip},o||{});
const ACT = (st,e,t,line,steps,min,o)=>Object.assign({st,k:'act',e,t,line,steps,min},o||{});
const CHQ = (st,scene,say,ask,ops,fb,o)=>{ const r = OPS(ops);
  return Object.assign({st,k:'choice',scene,say,ask,opts:r.opts,a:r.a[0],fb},o||{}); };
const FUP = (st,ask,ops,fb,o)=>{ const r = OPS(ops);
  return Object.assign({st,k:'choice',same:1,ask,opts:r.opts,a:r.a[0],fb},o||{}); };
const MUL = (st,scene,say,ask,ops,fb,o)=>{ const r = OPS(ops);
  return Object.assign({st,k:'multi',scene,say,ask,opts:r.opts,a:r.a,fb},o||{}); };
const ORD = (st,scene,say,steps,decoys,o)=>Object.assign({st,k:'order',scene,say,steps:lisSteps(steps),
  decoys:decoys?lisSteps(decoys):[]},o||{});
const BOS = (st,say,doIt,fb,o)=>Object.assign({st,k:'boss',scene:'📢',say,ask:'要做嗎？',opts:[DO,NODO],a:doIt?0:1,
  fb:fb||(doIt?'有「經理說」，要做。':'沒有「經理說」，不用做。')},o||{});
/* 一段話配一組追問：GRP(階段, 圖示, 聽到的話, [[標籤,問題,選項,答案說明],…], 第一項的額外設定) */
function GRP(st, scene, say, qs, o){
  return qs.map((q,j)=> j===0
    ? CHQ(st, scene, say, q[1], q[2], q[3], Object.assign({tag:q[0]}, o||{}))
    : FUP(st, q[1], q[2], q[3], {tag:q[0]}));
}
/* 嗶聲：BP([頻率…], 每聲長度秒)；高音約 880，低音約 330 */
const BP = (a,d)=>a.map(f=>({f,d:d||.45}));
/* 一句話配「時人地事」四問：SENT(階段, 圖示, 聽到的話, [時選項,人選項,地選項,事選項], 問題(可省), 第一項額外設定) */
function SENT(st, scene, say, o4, asks, o){
  const A = asks || ['是甚麼時候？','是誰在做事？','在哪裏？','做甚麼？'], T = ['時','人','地','事'];
  return GRP(st, scene, say, o4.map((ops,j)=>[T[j], A[j], ops]), o);
}
const X = arr => arr.map(it=>Object.assign(it,{x:1}));

/* 選擇題的選項次序：沒有自然次序的（人物、物品、行動）把正確答案平均分佈在各位置，

  const rnd = ()=>{ seed = (seed*1103515245 + 12345) & 0x7fffffff; return seed/0x7fffffff; };
  const shuf = a => { for(let i=a.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
  LIS.forEach(S=>S.items.forEach(it=>{
    if(it.k!=='choice' || it.opts.length<2 || ordered(it)) return;
    const n = it.opts.length;
    if(!bag[n] || !bag[n].length) bag[n] = shuf([...Array(n).keys()]);
    const target = bag[n].pop();
    const correct = it.opts[it.a], rest = shuf(it.opts.filter((_,j)=>j!==it.a));
    rest.splice(target, 0, correct); it.opts = rest; it.a = target;
  }));
})();

  if(ROLE==='t' && prevTop !== top){ try{ window.scrollTo(0,0); }catch(e){} }

  try{
    el.animate(move ? [{opacity:0, transform:'translateY(14px)'},{opacity:1, transform:'none'}]

};
var FIX2RE = null;
(function(){
  const ks = Object.keys(FIX2).sort((a,b)=>b.length-a.length);
  FIX2RE = ks.length ? new RegExp('('+ks.join('|')+')') : null;
})();
function rubyPlain(s){
  return [...String(s)].map(c=> JYUT[c] ? `<ruby>${c}<rt>${JYUT[c]}</rt></ruby>` : c).join('');
}
function ruby(s){
  s = String(s==null?'':s);
  if(!FIX2RE) return rubyPlain(s);
  return s.split(FIX2RE).map(p=> FIX2[p]
    ? [...p].map((c,j)=>{ const r = FIX2[p][j] || JYUT[c]; return r ? `<ruby>${c}<rt>${r}</rt></ruby>` : c; }).join('')
    : rubyPlain(p)).join('');
}
/* 粵拼識字卡用：一個詞語 → [[字, 粵拼], …] */
function jpOf(w){
  const fx = FIX2[w];
  return [...String(w)].map((c,j)=>[c, (fx && fx[j]) || JYUT[c] || '']);
}
/* 粵拼拆成聲母＋韻母（和學校的拼音表一樣，聲母以紅色顯示） */
function jpSplit(jp){
  const m = /^(ng|gw|kw|b|p|m|f|d|t|n|l|g|k|h|w|z|c|s|j)?(.*)$/.exec(jp || '');
  return [m[1]||'', m[2]||''];
}

function myLv(){ return ROLE==='t' ? 1 : ((stu(ME)||{}).lv||2); }

/* 決定性的洗牌：同一題每次排法一樣，重畫畫面時不會跳位 */
function seedOf(s){ let n=0; for(const c of String(s)) n = (n*31 + c.charCodeAt(0)) % 100003; return n; }
function shuf(arr, seed){
  const a = arr.slice(); let s = seed || 1;
  for(let i=a.length-1;i>0;i--){ s = (s*9301 + 49297) % 233280; const j = s % (i+1); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}
function shufNot(arr, seed){          /* 洗牌，但不可以剛好等於原本次序 */
  let a = shuf(arr, seed);
  if(arr.length>1 && a.every((x,i)=>x===arr[i])) a = a.slice(1).concat(a[0]);
  return a;
}
function itLvCnt(it, lv, dflt){ return (it.cnt && it.cnt[lv]) || dflt; }
function picks(list, n, seed){        /* 從清單挑 n 個，各組別平均 */
  if(list.length<=n) return list.slice();
  return list.slice(0, n);
}
function optImgName(it, o){ return (it.oi && it.oi[o]) || o; }
function optVisual(it, o, lv, size){
  const em = it.oe && it.oe[o];
  if(em) return `<span class="o-em">${em}</span>`;
  const src = im2(optImgName(it, o));
  if(src && (it.po || lv===3)) return `<img src="${src}" alt="">`;
  return '';
}
function qHead(it){
  const pic = it.img && im2(it.img) ? `<img class="it-pic" src="${im2(it.img)}" alt="">` : '';
  const em  = it.em ? `<div class="it-em">${it.em}</div>` : '';
  const cue = it.cue ? `<div class="it-cue">${esc(it.cue)}</div>` : '';
  const say = (it.say || it.k==='choice') ? `<button class="btn mint sm it-say" onclick="speak('${(it.say||it.q).replace(/'/g,'')}')">🔊 ${T('聽一次')}</button>` : '';
  return `<div class="it-q">${ruby(it.q||'')}${(ROLE==='s' && (stu(ME)||{}).en && it.qe)?`<span class="tr">${it.qe}</span>`:''}${(ROLE==='t' && it.qe && LANG==='en')?`<span class="tr">${it.qe}</span>`:''}</div>${cue}${pic}${em}${say}`;
}

/* order ------------------------------------------------------------- */
function orderInfo(it, lv){
  const n = it.parts.length;
  const need = ROLE==='t' ? n : Math.min(n, {1:n, 2:Math.min(n,4), 3:Math.min(n,2)}[lv] || n);
  const given = it.parts.slice(0, n-need);
  const want  = it.parts.slice(n-need);
  const pool = shufNot(want.map((t,i)=>({t, o:i})), seedOf(it.parts.join('')));
  return {need, given, want, pool, errorless: lv===3 && ROLE!=='t'};
}
function vOrder(it, key){
  const lv = myLv(), rec = recGet(key) || {s:[]};
  const I = orderInfo(it, lv), placed = rec.s || [];
  U2UI.lists[key] = I;
  const slots = I.want.map((_,j)=> {
    const o = placed[j];
    return o===undefined ? `<span class="slot ${j===placed.length?'next':''}"></span>`
      : `<button class="chip placed ${rec.ok?'ok':''}" onclick="iAct('unorder','${key}',${j})">${ruby(I.want[o])}</button>`;
  }).join('');
  const poolHtml = I.pool.map(c=> placed.includes(c.o) ? '' :
    `<button class="chip" onclick="iAct('order','${key}',${c.o})">${ruby(c.t)}</button>`).join('');
  return qHead(it) + `<div class="orderline">
      ${it.pre?`<span class="given">${ruby(it.pre)}</span>`:''}
      ${I.given.map(t=>`<span class="given">${ruby(t)}</span>`).join('')}${slots}</div>
    <div class="chips pool">${poolHtml || (rec.ok?`<span class="doneword">✅</span>`:'')}</div>
    <div class="row" style="justify-content:center;margin-top:10px">
      <button class="btn sm mint" onclick="speak('${((it.pre||'')+it.parts.join('')).replace(/'/g,'')}')">🔊 ${T('聽整句')}</button>
      ${(!rec.ok && placed.length)?`<button class="btn sm" onclick="iAct('orderclear','${key}')">↺ 重新排</button>`:''}</div>`;
}
function iOrder(key, o){
  const it = curItem(), lv = myLv(), I = orderInfo(it, lv), rec = recGet(key) || {s:[], e:0};
  if(rec.ok) return;
  const placed = (rec.s||[]).slice();
  if(placed.includes(o)) return;
  if(I.errorless){
    const exp = I.want[placed.length];
    if(I.want[o] !== exp){ recPut(key, {...rec, s:placed, e:(rec.e||0)+1}); render(); wrongFlash(); return; }
  }
  placed.push(o);
  if(placed.length === I.want.length){
    const ok = placed.every((x,j)=> I.want[x]===I.want[j]);
    if(ok){ recPut(key, {ok:1, e:rec.e||0, s:placed}); render(); afterCorrect(it); if(ROLE==='t') speak((it.pre||'')+it.parts.join('')); }
    else { recPut(key, {ok:0, e:(rec.e||0)+1, s:[]}); render(); wrongFlash(); }
    return;
  }
  recPut(key, {ok:0, e:rec.e||0, s:placed}); render();
}
function iUnorder(key, j){
  const rec = recGet(key) || {s:[]}; if(rec.ok) return;
  const placed = (rec.s||[]).slice(0, j);
  recPut(key, {ok:0, e:rec.e||0, s:placed}); render();
}
function iOrderClear(key){ const rec = recGet(key)||{}; if(rec.ok) return; recPut(key,{ok:0,e:rec.e||0,s:[]}); render(); }

/* fill -------------------------------------------------------------- */
function fillParts(t){
  const out = []; const re = /＿+/g; let last = 0, m, bi = 0;
  while((m = re.exec(t))){ if(m.index>last) out.push({s:t.slice(last, m.index)}); out.push({b:bi++}); last = m.index + m[0].length; }
  if(last<t.length) out.push({s:t.slice(last)});
  return out;
}
function fillOpts(it, bi, lv){
  const arr = it.bl[bi] || [];
  const n = ROLE==='t' ? Math.min(arr.length, 4) : Math.min(arr.length, CNT_OPT[lv]||3);
  return shufNot(arr.slice(0, n), seedOf(it.t + bi + arr[0]));
}
function vFill(it, key){
  const lv = myLv(), rec = recGet(key) || {s:[]}, got = rec.s || [];
  const parts = fillParts(it.t), cur = got.length;
  const body = parts.map(p=> p.s!==undefined ? ruby(p.s)
    : (got[p.b]!==undefined ? `<span class="blank filled">${ruby(got[p.b])}</span>`
       : `<span class="blank ${p.b===cur?'now':''}">&nbsp;</span>`)).join('');
  const nb = it.bl.length;
  let opts = '';
  if(cur < nb){
    const list = fillOpts(it, cur, lv); U2UI.lists[key] = list;
    opts = `<div class="opts it-opts">${list.map((o,j)=>{
      const vis = optVisual(it, o, lv);
      return `<button class="opt" onclick="iAct('fill','${key}',${j})">${vis}<span class="o-t">${ruby(o)}</span></button>`;}).join('')}</div>`;
  }
  const lab = (nb>1 && cur<nb) ? `<div class="fillstep">第 ${cur+1} 個空格／共 ${nb} 個</div>` : '';
  return `<div class="it-q fillq">${body}</div>${it.img&&im2(it.img)?`<img class="it-pic" src="${im2(it.img)}" alt="">`:''}${lab}${opts}
    ${rec.ok?`<div class="row" style="justify-content:center;margin-top:10px"><button class="btn sm mint" onclick="speak('${fillParts(it.t).map(p=>p.s!==undefined?p.s:it.bl[p.b][0]).join('').replace(/'/g,'')}')">🔊 ${T('聽整句')}</button></div>`:''}`;
}
function iFill(key, j){
  const it = curItem(), rec = recGet(key) || {s:[], e:0}, got = (rec.s||[]).slice();
  if(rec.ok) return;
  const bi = got.length, o = (U2UI.lists[key]||[])[j];
  if(o===undefined) return;
  if(o !== it.bl[bi][0]){ recPut(key, {ok:0, e:(rec.e||0)+1, s:got}); render(); wrongFlash(); return; }
  got.push(o);
  const done = got.length >= it.bl.length;
  recPut(key, {ok:done?1:0, e:rec.e||0, s:got}); render();
  if(done){ afterCorrect(it); if(ROLE==='t') speak(fillParts(it.t).map(p=>p.s!==undefined?p.s:it.bl[p.b][0]).join('')); }
}

/* sort -------------------------------------------------------------- */
function sortItems(it, lv){
  const n = ROLE==='t' ? it.its.length : itLvCnt(it, lv, it.its.length);
  if(n >= it.its.length) return it.its.map((x,i)=>({...x, _i:i}));
  /* 每個組別都要有：輪流各取一個 */
  const ids = it.bk.map(b=>b[0]), by = {}; ids.forEach(id=>by[id]=[]);
  it.its.forEach((x,i)=>by[x.to].push({...x, _i:i}));
  const out = []; let k = 0;
  while(out.length<n && ids.some(id=>by[id].length)){ const id = ids[k++ % ids.length]; if(by[id].length) out.push(by[id].shift()); }
  return out.sort((a,b)=>a._i-b._i);
}
function sortVis(x, big){
  const src = x.img && im2(x.img);
  return src ? `<img src="${src}" alt="">` : (x.em ? `<span class="o-em">${x.em}</span>` : '');
}
function vSort(it, key){
  const lv = myLv(), rec = recGet(key) || {p:{}}, p = rec.p || {};
  const items = sortItems(it, lv); U2UI.lists[key] = items;
  const sel = U2UI.sel[key];
  const buckets = it.bk.map(b=>{
    const inside = items.filter(x=>p[x._i]===b[0]).map(x=>`<span class="mini">${sortVis(x)}<span>${ruby(x.t)}</span></span>`).join('');
    return `<button class="bucket b-${b[0]} ${sel!==undefined?'ready':''}" onclick="iAct('bucket','${key}','${b[0]}')">
      <span class="bk-h"><span class="bk-ico">${b[2]||''}</span><span class="bk-lb">${ruby(b[1])}</span></span>
      <span class="bk-in">${inside}</span></button>`;
  }).join('');
  const pool = items.map(x=> p[x._i]!==undefined ? '' :
    `<button class="card ${sel===x._i?'sel':''}" onclick="iAct('pickitem','${key}',${x._i})">${sortVis(x)}<span class="c-t">${ruby(x.t)}</span></button>`).join('');
  const left = items.filter(x=>p[x._i]===undefined).length;
  return qHead(it) + `<div class="buckets">${buckets}</div>
    <div class="sorthint">${rec.ok?'✅ 全部分好了！':(sel!==undefined?'現在，按一按它屬於哪一組':'先按一張卡，再按它屬於的那一組')}</div>
    <div class="cards">${pool}</div>`;
}
function iPickItem(key, i){
  const rec = recGet(key) || {}; if(rec.ok) return;
  U2UI.sel[key] = (U2UI.sel[key]===i ? undefined : i); render();
}
function iBucket(key, id){
  const it = curItem(), rec = recGet(key) || {p:{}, e:0}, p = {...(rec.p||{})};
  const i = U2UI.sel[key]; if(i===undefined || rec.ok) return;
  const x = it.its[i];
  U2UI.sel[key] = undefined;
  if(x.to !== id){ recPut(key, {ok:0, e:(rec.e||0)+1, p}); render(); wrongFlash(); return; }
  p[i] = id;
  const items = U2UI.lists[key] || [];
  const done = items.every(y=>p[y._i]!==undefined);
  recPut(key, {ok:done?1:0, e:rec.e||0, p}); render();
  if(done) afterCorrect(it);
}

/* match ------------------------------------------------------------- */
function matchPairs(it, lv){
  const n = ROLE==='t' ? it.pairs.length : itLvCnt(it, lv, it.pairs.length);
  return it.pairs.slice(0, Math.min(n, it.pairs.length)).map((x,i)=>({...x, _i:i}));
}
function vMatch(it, key){
  const lv = myLv(), rec = recGet(key) || {m:{}}, m = rec.m || {};
  const pairs = matchPairs(it, lv); U2UI.lists[key] = pairs;
  const sel = U2UI.sel[key];
  const right = shufNot(pairs.map(x=>x._i), seedOf(pairs.map(x=>x.r).join('')));
  const usedR = new Set(Object.values(m));
  const left = pairs.map(x=>{
    const src = x.img && im2(x.img);
    const vis = src ? `<img src="${src}" alt="">` : (x.em ? `<span class="o-em">${x.em}</span>` : '');
    const got = m[x._i]!==undefined ? pairs.find(y=>y._i===m[x._i]) : null;
    return `<button class="mleft ${sel===x._i?'sel':''} ${got?'done':''}" onclick="iAct('mleft','${key}',${x._i})">
      ${vis}${x.l?`<span class="c-t">${ruby(x.l)}</span>`:''}
      <span class="mans">${got?ruby(got.r):'？'}</span></button>`;
  }).join('');
  const rch = right.map(ri=>{ const x = pairs.find(y=>y._i===ri);
    return `<button class="chip ${usedR.has(ri)?'used':''}" ${usedR.has(ri)?'disabled':''} onclick="iAct('mright','${key}',${ri})">${ruby(x.r)}</button>`; }).join('');
  return qHead(it) + `<div class="matchwrap"><div class="mlefts">${left}</div><div class="mrights">${rch}</div></div>
    <div class="sorthint">${rec.ok?'✅ 全部配對成功！':(sel!==undefined?'再按右邊的詞語':'先按左邊的一張，再按右邊的詞語')}</div>`;
}
function iMLeft(key, i){
  const rec = recGet(key) || {m:{}}; if(rec.ok) return;

}
function iMRight(key, ri){
  const it = curItem(), rec = recGet(key) || {m:{}, e:0}, m = {...(rec.m||{})};
  const i = U2UI.sel[key]; if(i===undefined || rec.ok) return;
  U2UI.sel[key] = undefined;
  if(i !== ri){ recPut(key, {ok:0, e:(rec.e||0)+1, m}); render(); wrongFlash(); return; }
  m[i] = ri;
  const done = Object.keys(m).length >= (U2UI.lists[key]||[]).length;
  recPut(key, {ok:done?1:0, e:rec.e||0, m}); render();

}

/* multi ------------------------------------------------------------- */
function multiList(it, lv){
  if(ROLE==='t') return it.opts.map((x,i)=>({...x,_i:i}));
  const okMax = {1:4, 2:3, 3:2}[lv]||3, badMax = {1:2, 2:2, 3:1}[lv]||2;
  const oks = it.opts.map((x,i)=>({...x,_i:i})).filter(x=>x.ok).slice(0, okMax);
  const bad = it.opts.map((x,i)=>({...x,_i:i})).filter(x=>!x.ok).slice(0, badMax);
  return shufNot([...oks, ...bad], seedOf(it.q)).slice();
}
function vMulti(it, key){
  const lv = myLv(), rec = recGet(key) || {sel:[]}, sel = rec.sel || [];
  const list = multiList(it, lv); U2UI.lists[key] = list;
  const nOk = list.filter(x=>x.ok).length;
  return qHead(it) + `<div class="sorthint">有 ${nOk} 個答案</div><div class="opts it-opts">` + list.map(x=>{
    const src = x.img && im2(x.img), vis = src ? `<img src="${src}" alt="">` : (x.em ? `<span class="o-em">${x.em}</span>` : '');
    const on = sel.includes(x._i), st = rec.ok ? (x.ok?'right':'') : (on?'pickd':'');
    return `<button class="opt ${st}" onclick="iAct('mtoggle','${key}',${x._i})">${vis}<span class="o-t">${ruby(x.t)}</span></button>`;
  }).join('') + `</div>
    <div class="row" style="justify-content:center;margin-top:14px">${rec.ok?'':
      `<button class="btn lemon" onclick="iAct('mcheck','${key}')">✔ 確定</button>`}</div>`;
}
function iMToggle(key, i){
  const rec = recGet(key) || {sel:[], e:0}; if(rec.ok) return;
  const sel = (rec.sel||[]).slice(); const k = sel.indexOf(i);
  if(k>=0) sel.splice(k,1); else sel.push(i);
  recPut(key, {ok:0, e:rec.e||0, sel}); render();
}
function iMCheck(key){
  const it = curItem(), rec = recGet(key) || {sel:[], e:0}, list = U2UI.lists[key] || [];
  const want = list.filter(x=>x.ok).map(x=>x._i).sort().join(','), got = (rec.sel||[]).slice().sort().join(',');
  if(!(rec.sel||[]).length) return;
  if(want===got){ recPut(key, {ok:1, e:rec.e||0, sel:rec.sel}); render(); afterCorrect(it); }
  else { recPut(key, {ok:0, e:(rec.e||0)+1, sel:rec.sel}); render(); wrongFlash(); }
}

function vTeach(it, key){

function spk(t){ return `speak('${String(t).replace(/'/g,'')}')`; }
function tcStrips(it){
  return it.rows.map((r,ri)=>{
    const src = r.img && im2(r.img);
    const full = r.parts.map(p=>p.t).join('');

/* ---- 計分 ---- */
function scoreOf2(sid){
  const s = stu(sid), a = myA(sid);
  let right = 0, total = 0; const det = [];
  words().forEach((w,i)=>{
    total++; const v = a['p'+i];
    const ok = v!==undefined && pickOpts(w, s.lv)[v]===w;
    if(ok) right++;
    det.push({lb:`選字「${w}」`, ok, done:v!==undefined});
  });
  itemsOf('x').forEach((it,i)=>{
    if(!scoredKind(it)) return;
    total++; const r = a['x'+i], ok = recOk(r);
    if(ok) right++;
    det.push({lb:`句子 ${i+1}`, ok, done:!!r});
  });
  itemsOf('q').forEach((it,i)=>{
    if(!scoredKind(it)) return;
    total++;
    let ok, done;
    if(it.wr && s.lv===1){
      const v = a['q'+i]!==undefined ? a['q'+i] : a['t_q'+i];
      ok = judge(it, v)===true; done = v!==undefined;
    } else { const r = a['q'+i]; ok = recOk(r); done = !!r; }
    if(ok) right++;
    det.push({lb:`問答 ${i+1}`, ok, done});
  });
  unitWords().forEach(w=>{
    const v = a['g_'+w]; if(v===undefined) return;
    total++; const ok = v===w; if(ok) right++;
    det.push({lb:`遊戲「${w}」`, ok, done:true});
  });
  return {right, total, det};
}

/* ───────────── ③ 課文影片 ───────────── */
const VP = {on:false, i:0, tok:0, rate:.8, jp:true, sub:true, echo:false, fb:null, gap:null, id:'', bar:null};
const VID_MIN = {k:.55};                /* 語音太快結束時，每句字幕至少停留估計時間的幾成 */
function cueMs(t, rate){ return Math.max(1800, String(t).length * 330 / (rate||.8)); }
function vidKeys(){ return [...new Set(LESSONS2.flatMap(l=>l.keys))]; }
function vidSubHTML(i){
  const c = VID2[i]; if(!c) return '';
  const toks = tokenize(c.t, vidKeys());
  return toks.map(t=> t.key ? `<b class="vk">${VP.jp?ruby(t.t):esc(t.t)}</b>` : (VP.jp?ruby(t.t):esc(t.t))).join('');
}
function vidTitleOf(v){ return (v.from===0 && v.to===VID2.length-1) ? '《科技產品》整篇課文' : '《科技產品》片段'; }
function openVideo(from, to, back){
  stopMedia();
  VP.i = from; VP.on = false; VP.id = Date.now().toString(36);
  CTRL.vid = {id:VP.id, from, to, i:from, t0:Date.now(), play:0, rate:VP.rate, jp:VP.jp?1:0, sub:VP.sub?1:0, echo:VP.echo?1:0, back:back||'unit', end:0};
  CTRL.screen = 'video'; CTRL.phase = 'idle';
  saveCtrl({force:true}); render();
  vidPlayFrom(from);
}
function vidPush(extra){
  if(!CTRL.vid) return;
  const v = CTRL.vid;
  Object.assign(v, {i:VP.i, t0:Date.now(), play:VP.on?1:0, rate:VP.rate, jp:VP.jp?1:0, sub:VP.sub?1:0, echo:VP.echo?1:0}, extra||{});
  saveCtrl({force:true});
}
function vidStop(){
  VP.tok++; VP.on = false;
  clearTimeout(VP.fb); clearTimeout(VP.gap);
  try{ speechSynthesis.cancel(); }catch(e){}
}
function vidPlayFrom(i){
  const v = CTRL.vid; if(!v) return;
  VP.tok++; clearTimeout(VP.fb); clearTimeout(VP.gap);
  VP.i = Math.max(v.from, Math.min(v.to, i)); VP.on = true;
  if(v.end){ v.end = 0; }
  vidPush({end:0}); vidShow(true);
  vidSayCue(VP.tok);
}
function vidSayCue(tok){
  const c = VID2[VP.i]; if(!c) return;
  const est = cueMs(c.t, VP.rate), t0 = Date.now();
  let fin = false;
  const done = ()=>{
    if(fin || tok!==VP.tok) return; fin = true; clearTimeout(VP.fb);
    const el = Date.now() - t0, minMs = est * VID_MIN.k;
    const go = ()=>{ if(tok!==VP.tok) return; vidAfterCue(tok); };
    if(el < minMs) VP.gap = setTimeout(go, minMs - el); else go();
  };
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(c.t.replace(/[《》]/g,''));
    u.lang = 'zh-HK'; u.rate = VP.rate; if(VOICE) u.voice = VOICE;
    u.onend = done; u.onerror = e=>{ if(e && /cancel|interrupt/i.test(String(e.error||''))) return; done(); };
    speechSynthesis.speak(u);
  }catch(e){}
  VP.fb = setTimeout(done, est * 2 + 2500);
  vidBar(est);
}
function vidAfterCue(tok){
  if(tok!==VP.tok || !VP.on) return;
  const v = CTRL.vid; if(!v) return;
  const go = ()=>{
    if(tok!==VP.tok) return;
    if(VP.i >= v.to){ vidFinish(); return; }
    const prevS = VID2[VP.i].s; VP.i++;
    const sceneChange = VID2[VP.i].s !== prevS;
    vidPush();                       /* 每一句都傳給學生機，字幕才會對準 */
    vidShow(sceneChange);
    vidSayCue(tok);
  };
  if(VP.echo){
    const est = cueMs(VID2[VP.i].t, VP.rate);
    vidEcho(true);
    VP.gap = setTimeout(()=>{ vidEcho(false); go(); }, est * .9 + 600);
  } else VP.gap = setTimeout(go, 380);
}
function vidFinish(){
  VP.on = false; VP.tok++;
  clearTimeout(VP.fb); clearTimeout(VP.gap);
  vidPush({end:1, play:0});
  const el = document.getElementById('vidEnd'); if(el) el.classList.add('show');
  const b = document.getElementById('vidBar'); if(b){ b.style.animation='none'; b.style.width='100%'; }
  vidCtl();
}
function vidPause(){
  if(!VP.on){ return vidPlayFrom(VP.i); }
  VP.tok++; VP.on = false; clearTimeout(VP.fb); clearTimeout(VP.gap);
  try{ speechSynthesis.cancel(); }catch(e){}
  vidPush({play:0}); vidCtl();
  const b = document.getElementById('vidBar'); if(b) b.style.animationPlayState = 'paused';
}
function vidSeek(i){
  const v = CTRL.vid; if(!v) return;
  const j = Math.max(v.from, Math.min(v.to, i));
  const was = VP.on;
  VP.tok++; clearTimeout(VP.fb); clearTimeout(VP.gap); try{ speechSynthesis.cancel(); }catch(e){}
  VP.i = j; vidEcho(false);
  if(was || v.end) vidPlayFrom(j); else { vidPush({end:0, play:0}); vidShow(true); }
}
function vidStep(d){ vidSeek(VP.i + d); }
function vidReplay(){ const v = CTRL.vid; if(v) vidPlayFrom(v.from); }
function vidRate(){
  VP.rate = VP.rate <= .66 ? .8 : (VP.rate <= .81 ? .95 : .65);
  vidPush(); vidCtl();
}
function vidTog(k){
  VP[k] = !VP[k];
  vidPush(); vidShow(false); vidCtl();
}
function closeVideo(){
  const v = CTRL.vid, back = v ? v.back : 'unit';
  vidStop(); CTRL.vid = null;
  CTRL.screen = back==='lesson' ? 'lesson' : 'unit';
  CTRL.phase = CTRL.screen==='lesson' ? STEP : 'idle';

}
/* 畫面更新（不重畫整頁，字幕和畫面平滑轉換） */
function vidBar(est){
  const b = document.getElementById('vidBar'); if(!b) return;
  b.style.animation = 'none'; void b.offsetWidth;
  b.style.animation = calmOn() ? 'none' : `vbar ${est}ms linear forwards`;
  b.style.width = calmOn() ? '100%' : '';
}
function vidEcho(on){ const e = document.getElementById('vidEcho'); if(e) e.classList.toggle('show', on); }
function vidShow(scene){
  const c = VID2[VP.i]; if(!c) return;
  const sub = document.getElementById('vSub'), img = document.getElementById('vSlide'), st = document.getElementById('vStage');
  if(sub){ sub.innerHTML = VP.sub ? vidSubHTML(VP.i) : '<span class="vhide">🔇</span>'; sub.classList.remove('pop'); void sub.offsetWidth; if(!calmOn()) sub.classList.add('pop'); }
  if(img){
    const src = IMG[c.img] || '';
    if(img.getAttribute('data-s') !== String(c.s)){
      img.setAttribute('data-s', c.s); img.src = src;
      const bx = document.getElementById('vBox'); if(bx) bx.style.setProperty('--ar', SLIDE_AR[c.s] || 1.6);
      img.classList.remove('kb'); void img.offsetWidth; if(!calmOn()) img.classList.add('kb');
    }
  }
  const ve = document.getElementById('vidEnd'); if(ve) ve.classList.toggle('show', !!(CTRL.vid && CTRL.vid.end));
  if(st){ st.setAttribute('data-fx', c.fx || ''); }
  const prog = document.querySelectorAll('#vProg i');
  prog.forEach((el,k)=>{ el.classList.toggle('cur', k+ (CTRL.vid?CTRL.vid.from:0) === VP.i); el.classList.toggle('past', k+(CTRL.vid?CTRL.vid.from:0) < VP.i); });
  const cnt = document.getElementById('vCnt'); if(cnt && CTRL.vid) cnt.textContent = `${VP.i - CTRL.vid.from + 1} ／ ${CTRL.vid.to - CTRL.vid.from + 1}`;
  vidCtl();
}
function vidCtl(){
  const p = document.getElementById('vPlay'); if(p) p.textContent = VP.on ? '⏸ 暫停' : (CTRL.vid && CTRL.vid.end ? '↺ 重播' : '▶ 播放');
  const r = document.getElementById('vRate'); if(r) r.textContent = `🐢 速度 ${VP.rate<.7?'慢':VP.rate<.9?'正常':'快'}`;
  const j = document.getElementById('vJp'); if(j) j.classList.toggle('holdon', VP.jp);
  const s = document.getElementById('vSubB'); if(s) s.classList.toggle('holdon', VP.sub);
  const e = document.getElementById('vEchoB'); if(e) e.classList.toggle('holdon', VP.echo);
}
function vidMain(){
  if(CTRL.vid && CTRL.vid.end) return vidReplay();
  if(VP.on) vidPause(); else vidPlayFrom(VP.i);
}
function tVideo(){
  const v = CTRL.vid; if(!v) return '<div class="note">沒有影片。<button class="btn sm" onclick="closeVideo()">返回</button></div>';
  if(VP.id !== v.id){ VP.id = v.id; VP.i = v.i; VP.on = false; v.play = 0; }
  const n = v.to - v.from + 1;
  const prog = Array.from({length:n}, (_,k)=>`<i onclick="vidSeek(${v.from+k})"></i>`).join('');
  const backLb = v.back==='lesson' ? '← 返回課堂' : '← 返回單元頁';
  return `<div class="vid" id="vStage" data-fx="${VID2[VP.i].fx||''}">
    <div class="vtop"><button class="btn sm" onclick="closeVideo()">${backLb}</button>
      <div class="vtitle">🎬 ${vidTitleOf(v)}</div><div class="vcnt" id="vCnt"></div>
      <div class="vprog" id="vProg">${prog}</div></div>
    <div class="vscreen">
      <div class="vframe"><div class="vbox" id="vBox"><img id="vSlide" data-s="" alt="" src=""></div>
        <div class="vend" id="vidEnd"><div class="vend-in"><div class="vend-em">🎉</div><div class="vend-t">看完了</div>
          <div class="row" style="justify-content:center"><button class="btn lemon" onclick="vidReplay()">↺ 再看一次</button>
          <button class="btn" onclick="closeVideo()">${backLb}</button></div></div></div></div>
      <div class="vsubwrap"><div class="vsub" id="vSub"></div><div class="vbarwrap"><div class="vbar" id="vidBar"></div></div>
        <div class="vecho" id="vidEcho">🗣️ 請跟著讀</div></div>
    </div>
    <div class="vctl">
      <button class="btn" onclick="vidStep(-1)">⏮ 上一句</button>
      <button class="btn lemon big" id="vPlay" onclick="vidMain()">▶ 播放</button>
      <button class="btn" onclick="vidStep(1)">下一句 ⏭</button>
      <span class="vsep"></span>
      <button class="btn sm" id="vRate" onclick="vidRate()">🐢 速度</button>
      <button class="btn sm" id="vJp" onclick="vidTog('jp')">粵拼</button>
      <button class="btn sm" id="vSubB" onclick="vidTog('sub')">字幕</button>
      <button class="btn sm" id="vEchoB" onclick="vidTog('echo')">🗣️ 跟讀停頓</button>
    </div></div>`;
}
/* 老師版：畫面建好之後接上目前狀態 */
function tVideoMount(){
  vidShow(true);
  const v = CTRL.vid;
  const e = document.getElementById('vidEnd'); if(e) e.classList.toggle('show', !!(v && v.end));
}

/* 學生版：跟著老師的影片（只看畫面和字幕；老師每換一句就同步一次） */
function svSubHTML(i, jp){
  const toks = tokenize(VID2[i].t, vidKeys());
  return toks.map(t=> t.key ? `<b class="vk">${jp?ruby(t.t):esc(t.t)}</b>` : (jp?ruby(t.t):esc(t.t))).join('');
}
function svSay(i){ return `speak('${VID2[i].t.replace(/[《》\']/g,'')}')`; }
function sVideo(me){
  const v = CTRL.vid; if(!v) return wait('🎬','等待影片','請看大電視');
  const i = Math.max(0, Math.min(VID2.length-1, v.i));
  return `<div class="stu"><div class="q svid" id="svid" data-id="${v.id}">
    <div class="vframe"><div class="vbox" id="svBox" style="--ar:${SLIDE_AR[VID2[i].s]||1.6}"><img id="svSlide" data-s="${VID2[i].s}" src="${IMG[VID2[i].img]||''}" alt=""></div></div>
    <div class="vsub s" id="svSub" data-sig="${i}|${v.sub}|${v.jp}">${v.sub?svSubHTML(i, v.jp):'<span class="vhide">🔇</span>'}</div>
    <div class="row" style="justify-content:center;margin-top:12px">
      <button class="btn mint" id="svSay" onclick="${svSay(i)}">🔊 ${T('聽一次')}</button></div>
    <div class="note" id="svEnd" style="text-align:center;${v.end?'':'display:none'}">${ruby('影片完了')}</div>
  </div></div>`;
}
/* 同一段影片裏，只更新字幕和畫面，不重建整頁（避免閃爍） */
function svUpdate(v){
  const i = Math.max(0, Math.min(VID2.length-1, v.i));
  const sub = document.getElementById('svSub'), im = document.getElementById('svSlide'), say = document.getElementById('svSay');
  const end = document.getElementById('svEnd');
  if(!sub || !im) return false;
  const sig = i+'|'+v.sub+'|'+v.jp;
  if(sub.getAttribute('data-sig') !== sig){
    sub.setAttribute('data-sig', sig);
    sub.innerHTML = v.sub ? svSubHTML(i, v.jp) : '<span class="vhide">🔇</span>';
    sub.classList.remove('pop'); void sub.offsetWidth; if(!calmOn()) sub.classList.add('pop');
    if(say) say.setAttribute('onclick', svSay(i));
    if(im.getAttribute('data-s') !== String(VID2[i].s)){
      im.setAttribute('data-s', VID2[i].s); im.src = IMG[VID2[i].img] || '';
      const bx = document.getElementById('svBox'); if(bx) bx.style.setProperty('--ar', SLIDE_AR[VID2[i].s] || 1.6);
    }
  }
  if(end) end.style.display = v.end ? '' : 'none';
  return true;
}
/* 學生版畫面入口（renderStudent 呼叫） */
function sVideoRender(B, me){
  const v = CTRL.vid;
  if(v && B.getAttribute('data-vid') === v.id && svUpdate(v)) return;
  B.innerHTML = sVideo(me);
  B.setAttribute('data-vid', v ? v.id : '');
}
/* 老師版畫面入口（renderTeacher 呼叫）：同一段影片只建一次 */
function tVideoRender(tp){
  const v = CTRL.vid;
  if(!v){ tp.innerHTML = tVideo(); return; }
  if(tp.getAttribute('data-vid') === v.id && document.getElementById('vStage')){ vidCtl(); return; }
  tp.innerHTML = tVideo(); tp.setAttribute('data-vid', v.id);
  tVideoMount();
}

/* 教師單元頁：額外按掣 */
function uAct(u){
  if(+u===2) return `<button class="btn lemon" onclick="openVideo(0,${VID2.length-1},'unit')">🎬 播放整篇課文影片</button>`;
  return '';
}

/* ───────────── ④ 列印（單元二：選擇、判斷、填充；其他題型只在平板電腦上做） ───────────── */
function printU2(lv, grey){
  const its = [...itemsOf('x'), ...itemsOf('q')].filter(it=>it.k==='choice' || it.k==='tf' || it.k==='fill');
  return its.map((it, n)=>{
    if(it.k==='choice'){
      const q = {q:it.q, ans:it.ans, opts:[it.ans, ...it.opts.slice(1)], hint:null};
      return printQ(q, n, lv, grey);
    }
    if(it.k==='tf'){
      return `<div class="q"><div class="qn">${n+1}.　${it.q}</div><div class="opts"><span class="opt">（　）對</span><span class="opt">（　）不對</span></div></div>`;
    }
    const txt = it.t.replace(/＿+/g, '（　　　）');
    const nOpt = {1:0, 2:3, 3:2}[lv] || 0;
    const opts = it.bl.map(b=> nOpt ? b.slice(0, nOpt) : null);
    const ans = it.bl.map(b=>b[0]);
    const bd = nOpt
      ? `<div class="opts">${opts.map(o=>o.map(x=>`<span class="opt">${x}</span>`).join('')).join('<br>')}</div>`
      : `<div class="ansline"><span class="alab">答：</span>${printCells(ans.join('、'), false)}</div>`;
    return `<div class="q"><div class="qn">${n+1}.　${txt}</div>${bd}</div>`;
  }).join('');
}

render();
</script>
